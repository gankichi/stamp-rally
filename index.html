<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく デジタルスタンプラリー</title>
    <style>
        /* --- 基本デザイン（通常モード） --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        /* コントロールパネル（言語・アクセシビリティ） */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .lang-btn.active {
            background-color: #ff5a5f;
            color: white;
        }

        /* 👁️ みやすさ切り替えボタン（通常時） */
        .accessibility-box {
            width: 100%;
            max-width: 300px;
        }
        .contrast-toggle-btn {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff5a5f;
            margin: 10px 0;
            font-size: 26px;
        }
        .info-text {
            background-color: #fff5da;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            color: #665544;
            line-height: 1.5;
        }
        
        /* スキャンボタン */
        .scan-btn {
            background-color: #ff5a5f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4);
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* コースエリア */
        .course-section {
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .course-w {
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
        }
        .course-u {
            background-color: #eff6ff;
            border: 2px dashed #60a5fa;
        }
        .course-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目の並び */
        .stamp-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 5px;
            overflow-x: auto;
        }
        .stamp-slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px dotted #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999999;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .stamp-slot.goal {
            border: 2px dashed #fbbf24;
            background-color: #fffdf5;
            color: #fbbf24;
            font-size: 16px;
        }
        
        /* 押されたスタンプ画像 */
        .stamp-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-msg {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #e5e7eb;
        }
        .reset-btn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #d1d5db;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* =========================================================
           👁️‍🗨️ 高コントラストモード（ロービジョン対策スタイル）
           ========================================================= */
        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        body.high-contrast .container {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 5px solid #ffffff !important;
            box-shadow: none !important;
        }
        body.high-contrast .contrast-toggle-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .lang-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
        }
        body.high-contrast .lang-btn.active {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast h1 {
            color: #ffffff !important;
            font-weight: 900 !important;
        }
        body.high-contrast .info-text {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast .scan-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
            box-shadow: none !important;
            font-size: 22px !important; /* 文字をより大きく */
        }
        body.high-contrast .course-section {
            background-color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .course-title {
            color: #ffffff !important;
            font-size: 22px !important;
        }
        body.high-contrast .stamp-slot {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important; /* 破線を実線に、太く */
            width: 65px !important;  /* 少し大きくして見やすく */
            height: 65px !important;
            font-size: 16px !important;
        }
        body.high-contrast .stamp-slot.goal {
            border: 4px double #ffffff !important;
            color: #ffffff !important;
        }
        body.high-contrast .stamp-image {
            /* 白黒画面でもイラストの形が判別しやすいよう、輪郭をくっきりさせるフィルター */
            filter: contrast(150%) brightness(110%);
            border: 2px solid #ffffff;
        }
        body.high-contrast .status-msg {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
            font-size: 18px !important;
        }
        body.high-contrast .reset-btn {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            font-size: 14px !important;
            padding: 8px 20px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <div class="lang-buttons">
            <button class="lang-btn active" onclick="switchLang('ja')">日本語</button>
            <button class="lang-btn" onclick="switchLang('en')">English</button>
            <button class="lang-btn" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" onclick="switchLang('ko')">한국어</button>
        </div>
        
        <div class="accessibility-box">
            <button class="contrast-toggle-btn" onclick="toggleContrast()" id="contrastBtn">
                👁️ みやすさ：しろうろこ（通常）
            </button>
        </div>
    </div>

    <h1 id="mainTitle">わくわく スタンプラリー</h1>
    
    <div class="info-text" id="infoText">
        下のボタンをおして、お店のQRコードをよみとろう！<br>
        タブがふえずにスタンプがたまるよ！
    </div>

    <button class="scan-btn" onclick="simulateScan()">
        📷 <span id="scanBtnText">QRコードをよみとる</span>
    </button>

    <div class="course-section course-w">
        <div class="course-title">🟢 <span id="titleW">わくわくコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-W1">W1</div>
            <div class="stamp-slot" id="slot-W2">W2</div>
            <div class="stamp-slot" id="slot-W3">W3</div>
            <div class="stamp-slot" id="slot-W4">W4</div>
            <div class="stamp-slot goal" id="slot-W-goal">★</div>
        </div>
    </div>

    <div class="course-section course-u">
        <div class="course-title">🔵 <span id="titleU">うきうきコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-U1">U1</div>
            <div class="stamp-slot" id="slot-U2">U2</div>
            <div class="stamp-slot" id="slot-U3">U3</div>
            <div class="stamp-slot" id="slot-U4">U4</div>
            <div class="stamp-slot goal" id="slot-U-goal">★</div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">
        スタンプのまるをタップしてみてね！
    </div>

    <button class="reset-btn" onclick="resetRally()" id="resetBtn">リセット</button>
</div>

<script>
    // --- 翻訳データ ---
    const i18n = {
        ja: {
            title: "わくわく スタンプラリー",
            info: "下のボタンをおして、お店のQRコードをよみとろう！<br>タブがふえずにスタンプがたまるよ！",
            scan: "QRコードをよみとる",
            courseW: "わくわくコース",
            courseU: "うきうきコース",
            hint: "スタンプのまるをタップしてみてね！",
            reset: "リセット",
            btnNormal: "👁️ みやすさ：通常（カラー）",
            btnHigh: "👁️ みやすさ：はっきり（白黒）"
        },
        en: {
            title: "Exciting Stamp Rally",
            info: "Tap the button below to scan the shop's QR code!<br>Stamps accumulate without opening new tabs.",
            scan: "Scan QR Code",
            courseW: "Wakuwaku Course",
            courseU: "Ukiuki Course",
            hint: "Try tapping the stamp circles!",
            reset: "Reset",
            btnNormal: "👁️ View: Normal (Color)",
            btnHigh: "👁️ View: High Contrast"
        },
        zh: {
            title: "集章拉力赛",
            info: "点击下方按钮扫描商家QR码！<br>无需打开新标签页即可集章。",
            scan: "扫描QR码",
            courseW: "Wakuwaku 路线",
            courseU: "Ukiuki 路线",
            hint: "尝试点击印章圆圈！",
            reset: "重置",
            btnNormal: "👁️ 视角: 普通（彩色）",
            btnHigh: "👁️ 视角: 高对比度（黑白）"
        },
        ko: {
            title: "두근두근 스탬프 랠리",
            info: "아래 버튼을 눌러 매장의 QR 코드를 스캔하세요!<br>새 탭을 열지 않고 스탬프가 적립됩니다.",
            scan: "QR 코드 스캔",
            courseW: "와쿠와쿠 코스",
            courseU: "우키우키 코스",
            hint: "스탬프 동그라미를 탭해 보세요!",
            reset: "리셋",
            btnNormal: "👁️ 보기: 일반 (컬러)",
            btnHigh: "👁️ 보기: 고대비 (흑백)"
        }
    };

    let currentLang = 'ja';
    let isHighContrast = false;

    // --- 言語切り替え機能 ---
    function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('mainTitle').innerText = i18n[lang].title;
        document.getElementById('infoText').innerHTML = i18n[lang].info;
        document.getElementById('scanBtnText').innerText = i18n[lang].scan;
        document.getElementById('titleW').innerText = i18n[lang].courseW;
        document.getElementById('titleU').innerText = i18n[lang].courseU;
        document.getElementById('statusMsg').innerText = i18n[lang].hint;
        document.getElementById('resetBtn').innerText = i18n[lang].reset;
        
        updateContrastButtonText();
    }

    // --- 👁️ 高コントラスト（みやすさ）トグル機能 ---
    function toggleContrast() {
        isHighContrast = !isHighContrast;
        if (isHighContrast) {
            document.body.classList.add('high-contrast');
        } else {
            document.body.classList.remove('high-contrast');
        }
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        if (isHighContrast) {
            btn.innerText = i18n[currentLang].btnNormal;
        } else {
            btn.innerText = i18n[currentLang].btnHigh;
        }
    }

    // --- テスト用の簡易スタンプ付与ロジック ---
    // 本番はここにQRコードリーダーのプログラム（jsQRなど）が連動します
    function simulateScan() {
        alert("カメラ起動（テスト用）：デモとしてW1のスタンプを押します。");
        stampPressed("W1");
    }

    // マスを直接タップしてもテストできるようにしています
    document.querySelectorAll('.stamp-slot').forEach(slot => {
        slot.addEventListener('click', function() {
            const id = this.id.replace('slot-', '');
            if(!id.includes('goal')) {
                stampPressed(id);
            }
        });
    });

    function stampPressed(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (slot && !slot.querySelector('img')) {
            // テスト用画像として前にアップロードされた「HOW_logo_W1.png」を表示
            slot.innerHTML = `<img src="HOW_logo_W1.png" class="stamp-image" alt="スタンプ">`;
            document.getElementById('statusMsg').innerText = `【${spotCode}】スタンプをゲットしました！`;
            checkGoal();
        }
    }

    function checkGoal() {
        // ゴール判定ロジック（簡易版）
        const wCount = document.querySelectorAll('.course-w .stamp-image').length;
        if (wCount === 4) {
            document.getElementById('slot-W-goal').innerText = "🎉";
            document.getElementById('statusMsg').innerText = "わくわくコースクリア！景品をもらってね！";
        }
    }

    function resetRally() {
        localStorage.clear();
        location.reload();
    }

    // 初期化
    updateContrastButtonText();
</script>

</body>
</html>
