<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく デジタルスタンプラリー</title>
    <style>
        /* --- 基本デザイン（通常モード） --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        /* コントロールパネル（言語・アクセシビリティ） */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .lang-btn.active {
            background-color: #ff5a5f;
            color: white;
        }

        /* 👁️ みやすさ切り替えボタン */
        .accessibility-box {
            width: 100%;
            max-width: 300px;
        }
        .contrast-toggle-btn {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff5a5f;
            margin: 10px 0;
            font-size: 26px;
        }
        .info-text {
            background-color: #fff5da;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            color: #665544;
            line-height: 1.5;
        }
        
        /* スキャンボタン */
        .scan-btn {
            background-color: #ff5a5f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4);
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* コースエリア */
        .course-section {
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .course-w {
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
        }
        .course-u {
            background-color: #eff6ff;
            border: 2px dashed #60a5fa;
        }
        .course-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目の並び */
        .stamp-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 5px;
            overflow-x: auto;
        }
        .stamp-slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px dotted #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999999;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .stamp-slot.goal {
            border: 2px dashed #fbbf24;
            background-color: #fffdf5;
            color: #fbbf24;
            font-size: 16px;
        }
        
        /* 押されたスタンプ（リンクの入る枠） */
        .stamp-link {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
        }
        .stamp-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-msg {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #e5e7eb;
        }
        .reset-btn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #d1d5db;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* --- 👁️‍🗨️ 高コントラストモードスタイル --- */
        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        body.high-contrast .container {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 5px solid #ffffff !important;
        }
        body.high-contrast .contrast-toggle-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .lang-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
        }
        body.high-contrast .lang-btn.active {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast h1 { color: #ffffff !important; font-weight: 900 !important; }
        body.high-contrast .info-text {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast .scan-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
            font-size: 22px !important;
        }
        body.high-contrast .course-section {
            background-color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .course-title { color: #ffffff !important; font-size: 22px !important; }
        body.high-contrast .stamp-slot {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
            width: 65px !important;
            height: 65px !important;
            font-size: 16px !important;
        }
        body.high-contrast .stamp-slot.goal { border: 4px double #ffffff !important; color: #ffffff !important; }
        body.high-contrast .stamp-image {
            filter: contrast(150%) brightness(110%);
            border: 2px solid #ffffff;
        }
        body.high-contrast .status-msg {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
            font-size: 18px !important;
        }
        body.high-contrast .reset-btn {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            font-size: 14px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <div class="lang-buttons">
            <button class="lang-btn active" onclick="switchLang('ja')">日本語</button>
            <button class="lang-btn" onclick="switchLang('en')">English</button>
            <button class="lang-btn" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" onclick="switchLang('ko')">한국어</button>
        </div>
        
        <div class="accessibility-box">
            <button class="contrast-toggle-btn" onclick="toggleContrast()" id="contrastBtn">
                👁️ みやすさ：通常（カラー）
            </button>
        </div>
    </div>

    <h1 id="mainTitle">わくわく スタンプラリー</h1>
    
    <div class="info-text" id="infoText">
        下のボタンをおして、お店のQRコードをよみとろう！<br>
        スタンプをあつめると、各施設（しせつ）のホームページが見られるよ！
    </div>

    <button class="scan-btn" onclick="simulateScan()">
        📷 <span id="scanBtnText">QRコードをよみとる</span>
    </button>

    <div class="course-section course-w">
        <div class="course-title">🟢 <span id="titleW">わくわくコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-W1">W1</div>
            <div class="stamp-slot" id="slot-W2">W2</div>
            <div class="stamp-slot" id="slot-W3">W3</div>
            <div class="stamp-slot" id="slot-W4">W4</div>
            <div class="stamp-slot goal" id="slot-W-goal">★</div>
        </div>
    </div>

    <div class="course-section course-u">
        <div class="course-title">🔵 <span id="titleU">うきうきコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-U1">U1</div>
            <div class="stamp-slot" id="slot-U2">U2</div>
            <div class="stamp-slot" id="slot-U3">U3</div>
            <div class="stamp-slot" id="slot-U4">U4</div>
            <div class="stamp-slot goal" id="slot-U-goal">★</div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">
        QRコードをよみとってスタンプをあつめよう！
    </div>

    <button class="reset-btn" onclick="resetRally()" id="resetBtn">リセット</button>
</div>

<script>
    // --- 各スポットの施設ホームページURL（設定） ---
    // 打合せ用に仮のURL（例としてGoogleやYahooなど）を入れています。本番用に書き換え可能です。
    const spotLinks = {
        "W1": "https://www.google.com",
        "W2": "https://www.yahoo.co.jp",
        "W3": "https://www.bing.com",
        "W4": "https://www.wikipedia.org",
        "U1": "https://www.google.com",
        "U2": "https://www.yahoo.co.jp",
        "U3": "https://www.bing.com",
        "U4": "https://www.wikipedia.org"
    };

    // --- 翻訳データ ---
    const i18n = {
        ja: {
            title: "わくわく スタンプラリー",
            info: "下のボタンをおして、お店のQRコードをよみとろう！<br>スタンプをあつめると、各施設（しせつ）のホームページが見られるよ！",
            scan: "QRコードをよみとる",
            courseW: "わくわくコース",
            courseU: "うきうきコース",
            hint: "QRコードをよみとってスタンプをあつめよう！",
            reset: "リセット",
            btnNormal: "👁️ みやすさ：通常（カラー）",
            btnHigh: "👁️ みやすさ：はっきり（白黒）"
        },
        en: {
            title: "Exciting Stamp Rally",
            info: "Tap the button below to scan the shop's QR code!<br>Collect stamps to view each facility's website!",
            scan: "Scan QR Code",
            courseW: "Wakuwaku Course",
            courseU: "Ukiuki Course",
            hint: "Scan QR codes to collect stamps!",
            reset: "Reset",
            btnNormal: "👁️ View: Normal (Color)",
            btnHigh: "👁️ View: High Contrast"
        },
        zh: {
            title: "集章拉力赛",
            info: "点击下方按钮扫描商家QR码！<br>集齐印章即可查看各设施的官方网站！",
            scan: "扫描QR码",
            courseW: "Wakuwaku 路线",
            courseU: "Ukiuki 路线",
            hint: "扫描QR码来收集印章！",
            reset: "重置",
            btnNormal: "👁️ 视角: 普通（彩色）",
            btnHigh: "👁️ 视角: 高对比度（黑白）"
        },
        ko: {
            title: "두근두근 스탬프 랠り",
            info: "아래 버튼을 눌러 매장의 QR 코드를 스캔하세요!<br>스탬프를 모으면 각 시설의 홈페이지를 볼 수 있습니다!",
            scan: "QR 코드 스캔",
            courseW: "와쿠와쿠 코스",
            courseU: "우키우키 코스",
            hint: "QR 코드를 스캔하여 스탬프를 모으세요!",
            reset: "리셋",
            btnNormal: "👁️ 보기: 일반 (컬러)",
            btnHigh: "👁️ 보기: 고대비 (흑백)"
        }
    };

    let currentLang = 'ja';
    let isHighContrast = false;

    function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('mainTitle').innerText = i18n[lang].title;
        document.getElementById('infoText').innerHTML = i18n[lang].info;
        document.getElementById('scanBtnText').innerText = i18n[lang].scan;
        document.getElementById('titleW').innerText = i18n[lang].courseW;
        document.getElementById('titleU').innerText = i18n[lang].courseU;
        document.getElementById('statusMsg').innerText = i18n[lang].hint;
        document.getElementById('resetBtn').innerText = i18n[lang].reset;
        
        updateContrastButtonText();
    }

    function toggleContrast() {
        isHighContrast = !isHighContrast;
        if (isHighContrast) {
            document.body.classList.add('high-contrast');
        } else {
            document.body.classList.remove('high-contrast');
        }
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        if (isHighContrast) {
            btn.innerText = i18n[currentLang].btnNormal;
        } else {
            btn.innerText = i18n[currentLang].btnHigh;
        }
    }

    // --- 【打合せデモ用ロジック】 ---
    // 本番はQRコードを読み取った際に、そのスポットのコード（W1など）が自動で stampPressed() に渡されます。
    // 今回はデモボタンを押すたびに、W1 → W2 → W3... と順番に疑似スキャンが進むようにしました。
    let demoIndex = 0;
    const demoSpots = ["W1", "W2", "W3", "W4", "U1"];

    function simulateScan() {
        if (demoIndex < demoSpots.length) {
            const currentSpot = demoSpots[demoIndex];
            alert(`【デモ動作】QRコードから「${currentSpot}」を検出しました！スタンプを押します。`);
            stampPressed(currentSpot);
            demoIndex++;
        } else {
            alert("デモ用のスタンプは押し終わりました。一度リセットしてください。");
        }
    }

    // ※マスを直接タップする「テスト用タップ機能」は完全に削除しました。

    // スタンプを押す処理（施設ホームページのリンクを埋め込む）
    function stampPressed(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (slot && !slot.querySelector('img')) {
            const destinationUrl = spotLinks[spotCode] || "#";
            
            // マスの中に、施設サイトへのリンク付きで画像を埋め込みます
            slot.innerHTML = `
                <a href="${destinationUrl}" target="_blank" class="stamp-link">
                    <img src="HOW_logo_W1.png" class="stamp-image" alt="${spotCode}">
                </a>
            `;
            document.getElementById('statusMsg').innerHTML = `🎉【${spotCode}】ゲット！<br><span style="font-size:12px; font-weight:normal;">スタンプをタップすると施設サイトへ移動します</span>`;
            checkGoal();
        }
    }

    function checkGoal() {
        const wCount = document.querySelectorAll('.course-w .stamp-image').length;
        if (wCount === 4) {
            document.getElementById('slot-W-goal').innerText = "🎉";
            document.getElementById('statusMsg').innerHTML = "<strong>わくわくコースクリア！景品をもらってね！</strong>";
        }
    }

    function resetRally() {
        localStorage.clear();
        location.reload();
    }

    updateContrastButtonText();
</script>

</body>
</html>
