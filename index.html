        /* --- 基本デザイン --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .lang-btn.active { background-color: #ff5a5f; color: white; }
        
        /* 🔊 音声・アクセシビリティエリア */
        .accessibility-box {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .audio-btn {
            width: 100%; background-color: #0284c7; color: #ffffff; border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .audio-btn.playing { background-color: #ef4444; }
        .contrast-toggle-btn {
            width: 100%; background-color: #222222; color: #ffffff; border: 2px solid #000000;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { color: #ff5a5f; margin: 10px 0; font-size: 24px; }
        .info-text {
            background-color: #fff5da; padding: 12px; border-radius: 10px; font-size: 14px;
            margin-bottom: 20px; color: #665544; line-height: 1.5; text-align: left;
        }

        .scan-btn {
            background-color: #ff5a5f; color: white; border: none; padding: 14px 28px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4); margin-bottom: 20px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .camera-container {
            display: none; position: relative; width: 100%; max-width: 320px;
            margin: 0 auto 20px auto; border: 3px solid #ff5a5f; border-radius: 12px;
            overflow: hidden; background-color: #000;
        }
        #video-preview { width: 100%; height: auto; display: block; }
        .camera-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%; border: 2px dashed #ff5a5f;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none;
        }

        /* コースエリア */
        .course-section { border-radius: 15px; padding: 15px 10px; margin-bottom: 20px; box-sizing: border-box; }
        .course-w { background-color: #f0fdf4; border: 2px dashed #4ade80; }
        .course-u { background-color: #eff6ff; border: 2px dashed #60a5fa; }
        .course-title { font-weight: bold; font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        .stamp-grid { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px; overflow-x: auto; }
        .stamp-slot {
            width: 55px; height: 55px; border-radius: 50%; background-color: #ffffff; border: 2px dotted #cccccc;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999999; font-weight: bold;
            position: relative; flex-shrink: 0; box-sizing: border-box; cursor: pointer; user-select: none;
        }
        .stamp-slot.special { border: 2px dashed #a855f7; background-color: #faf5ff; color: #a855f7; font-size: 11px; }
        .stamp-image { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .stamp-default-mark {
            width: 100%; height: 100%; border-radius: 50%; background-color: #ffebd3; border: 2px solid #ff5a5f;
            color: #ff5a5f; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; box-sizing: border-box;
        }
        .stamp-special-mark {
            width: 100%; height: 100%; border-radius: 50%; background-color: #f3e8ff; border: 2px solid #a855f7;
            color: #a855f7; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; box-sizing: border-box;

        .status-msg {
            background-color: #f3f4f6; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: bold;
            margin-top: 10px; border: 1px solid #e5e7eb; min-height: 60px;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
        }
        .facility-link-btn {
            display: inline-block; background-color: #3b82f6; color: white !important; text-decoration: none;
            padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 5px; font-weight: bold;
        }

        /* 📦 景品交換状況エリア */
        .gift-status-section {
            margin-top: 25px; padding: 15px; background-color: #f8fafc; border: 3px solid #cbd5e1; border-radius: 15px; text-align: left;

        .gift-row:last-child { border-bottom: none; }
        .gift-name { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .gift-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-align: center; }
        .gift-badge.yet { background-color: #e2e8f0; color: #64748b; border: 1px solid #cbd5e1; }
        .gift-badge.done { background-color: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; font-size: 13px; }

        .reset-btn { background-color: transparent; color: #9ca3af; border: 1px solid #d1d5db; padding: 5px 15px; font-size: 12px; border-radius: 10px; cursor: pointer; margin-top: 20px; }

    <h1 id="mainTitle">わくわく スタンプラリー（テスト用）</h1>

        各スポットにあるQRコードを読み取るとスタンプが押されるよ！<br>

    <button class="scan-btn" onclick="toggleCamera()" id="scanBtn">
        📷 <span id="scanBtnText">QRコードを読み取る</span>
    </button>
    <div class="camera-container" id="cameraArea">
        <video id="video-preview" autoplay playsinline></video>

    </div>

            <div class="stamp-slot" id="slot-W2" onclick="handleSlotClick('W2')">W2</div>
            <div class="stamp-slot" id="slot-W3" onclick="handleSlotClick('W3')">W3</div>
            <div class="stamp-slot" id="slot-W4" onclick="handleSlotClick('W4')">W4</div>
            <div class="stamp-slot special" id="slot-W5" onclick="handleSlotClick('W5')">SP</div>
        </div>
    </div>

    <!-- うきうきコース (U) -->

            <div class="stamp-slot" id="slot-U2" onclick="handleSlotClick('U2')">U2</div>
            <div class="stamp-slot" id="slot-U3" onclick="handleSlotClick('U3')">U3</div>
            <div class="stamp-slot" id="slot-U4" onclick="make_clickable_or_not('U4')">U4</div>
            <div class="stamp-slot special" id="slot-U5" onclick="handleSlotClick('U5')">SP</div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">QRコードをよみとってスタンプをあつめよう！</div>

    <div class="gift-status-section">
        <div class="gift-status-title" id="giftTitle">🎁 景品交換状況</div>
        <div class="gift-row">
            <span class="gift-name">🟢 <span id="giftLabelW">わくわくコース景品</span></span>
            <span class="gift-badge yet" id="badge-W">未受け取り</span>
        </div>
        <div class="gift-row">
            <span class="gift-name">🔵 <span id="giftLabelU">うきうきコース景品</span></span>
            <span class="gift-badge yet" id="badge-U">未受け取り</span>
        </div>
    </div>

</div>

                    "U5": { name: "신나고 스페셜", message: "특별한 스탬프를 획득했습니다!", url: "https://www.kodomo-how.com/", hint: "🔍【U5 힌트】특별한 장소에 숨겨져 있어요!", speechHint: "U 5 스페셜 스탬프 힌트.", speechGet: "신나고 스페셜 스탬프 획득!" }
                },
                ui: {
                    title: "두근두근 스탬프 랠리(테스트용)", info: "각 스팟에 있는 QR 코드를 스캔하면 스탬프가 찍혀요! 상품은 선착순입니다.",
                    scanBtnStart: "QR 코드 스캔하기", scanBtnStop: "카메라 닫기",
                    courseW: "두근두근 코스", courseU: "신나고 코스",
                    defaultHint: "QR 코드를 스캔하여 스탬프를 모아보세요!",
                    clearW: "두근두근 코스 완료! 교환처에서 상품 전용 QR 코드를 스캔하세요!",
                    clearU: "신나고 코스 완료! 교환처에서 상품 전용 QR 코드를 스캔하세요!",
                    clearBoth: "두 코스를 모두 완료했습니다! 대단해요!",
                    reset: "처음부터 다시 하기", btnNormal: "👁️ 보기: 보통 (컬러)", btnHigh: "👁️ 보기: 또렷하게 (흑백)",
                    goWeb: "홈페이지 보기", stampDefaultText: "완료", stampSpecialText: "특",
                    giftTitle: "🎁 경품 교환 상황", giftLabelW: "두근두근 코스 상품", giftLabelU: "신나고 코스 상품",
                    giftYet: "미수령", giftDone: "수령 완료",
                    audioStart: "음성 가이드 듣기", audioStop: "음성 중지",
                    speechDefault: "각 스팟에 있는 QR 코드를 스캔하면 스탬프가 찍혀요! 상품은 선착순입니다."
                }
            }
        }
    };

    // --- 内部変数 ---
    let currentLang = 'ja';
    let isHighContrast = false;
    let lastActiveSpot = null;          
    let collectedSpots = new Set();  
    let redeemedW = false; 
    let redeemedU = false; 
    let videoStream = null;

    // 🔊 音声ブラウザ対応
    let synth = null;
    try {
        if (typeof window !== 'undefined' && window.speechSynthesis) {
            synth = window.speechSynthesis;
        }
    } catch(e) {
        console.log("SpeechSynthesis is not supported or restricted.");
    }

    function loadUserData() {
        const saved = localStorage.getItem('vaku_rally_data_v6');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                collectedSpots = new Set(parsed.spots || []);
                lastActiveSpot = parsed.lastActive || null;
                redeemedW = parsed.redeemedW || false;
                redeemedU = parsed.redeemedU || false;
            } catch(e) {}
        }
    }

    function saveUserData() {
        const data = {
            spots: Array.from(collectedSpots), lastActive: lastActiveSpot,
            redeemedW: redeemedW, redeemedU: redeemedU
        };
        localStorage.setItem('vaku_rally_data_v6', JSON.stringify(data));
    }

    function switchLang(lang) {
        stopSpeech();
        currentLang = spotMaster.languages[lang] ? lang : 'ja';
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${currentLang}`);
        if(activeBtn) activeBtn.classList.add('active');

        const textUI = spotMaster.languages[currentLang].ui;
        document.getElementById('mainTitle').innerText = textUI.title;
        document.getElementById('infoText').innerHTML = textUI.info;
        document.getElementById('titleW').innerText = textUI.courseW;
        document.getElementById('titleU').innerText = textUI.courseU;
        document.getElementById('resetBtn').innerText = textUI.reset;
        document.getElementById('giftTitle').innerText = textUI.giftTitle;
        document.getElementById('giftLabelW').innerText = textUI.giftLabelW;
        document.getElementById('giftLabelU').innerText = textUI.giftLabelU;
        
        if (videoStream) {
            document.getElementById('scanBtnText').innerText = textUI.scanBtnStop;
        } else {
            document.getElementById('scanBtnText').innerText = textUI.scanBtnStart;
        }
        
        updateStampDisplayAll();
        updateGiftBadges();
        updateMessageArea();
        updateContrastButtonText();
        updateAudioButtonText();
    }

    function updateGiftBadges() {
        const textUI = spotMaster.languages[currentLang].ui;
        const badgeW = document.getElementById('badge-W');
        const badgeU = document.getElementById('badge-U');

        if(badgeW) {
            badgeW.innerText = redeemedW ? textUI.giftDone : textUI.giftYet;
            badgeW.className = redeemedW ? "gift-badge done" : "gift-badge yet";
        }
        if(badgeU) {
            badgeU.innerText = redeemedU ? textUI.giftDone : textUI.giftYet;
            badgeU.className = redeemedU ? "gift-badge done" : "gift-badge yet";
        }
    }

    function updateMessageArea() {
        const statusEl = document.getElementById('statusMsg');
        if(!statusEl) return;
        const textUI = spotMaster.languages[currentLang].ui;
        const spotsData = spotMaster.languages[currentLang].spots;
        
        const wMaster = ["W1", "W2", "W3", "W4", "W5"];
        const uMaster = ["U1", "U2", "U3", "U4", "U5"];
        const isWComplete = wMaster.every(s => collectedSpots.has(s));
        const isUComplete = uMaster.every(s => collectedSpots.has(s));

        if (isWComplete && isUComplete && !redeemedW && !redeemedU) {
            statusEl.innerHTML = `<strong>${textUI.clearBoth}</strong>`; return;
        }
        if (isWComplete && !redeemedW) {
            statusEl.innerHTML = `<strong>${textUI.clearW}</strong>`; return;
        }
        if (isUComplete && !redeemedU) {
            statusEl.innerHTML = `<strong>${textUI.clearU}</strong>`; return;
        }

        if (lastActiveSpot && spotsData[lastActiveSpot]) {
            const detail = spotsData[lastActiveSpot];
            if (collectedSpots.has(lastActiveSpot)) {
                statusEl.innerHTML = `
                    <div><strong>🎉【${detail.name}】GET!</strong></div>
                    <div style="font-size: 13px; font-weight: normal; color: #666; margin: 2px 0;">${detail.message}</div>
                    <a href="${detail.url}" target="_blank" class="facility-link-btn">${textUI.goWeb} 🔗</a>
                `;
            } else {
                statusEl.innerText = detail.hint;
            }
        } else {
            statusEl.innerText = textUI.defaultHint;
        }
    }

    function toggleSpeech() {
        if (!synth) { alert("このブラウザまたは画面は音声読み上げに対応していません。"); return; }

        try {
            if (synth.speaking) {
                stopSpeech();
                return;
            }

            const textUI = spotMaster.languages[currentLang].ui;
            const spotsData = spotMaster.languages[currentLang].spots;
            
            // 完全に初期状態の案内テキストをデフォルトに設定
            let targetText = textUI.speechDefault;

            const wMaster = ["W1", "W2", "W3", "W4", "W5"];
            const uMaster = ["U1", "U2", "U3", "U4", "U5"];
            const isWComplete = wMaster.every(s => collectedSpots.has(s));
            const isUComplete = uMaster.every(s => collectedSpots.has(s));

            // 条件分岐の判定（画面文字をそのまま読まず、専用テキストに固定）
            if (isWComplete && !redeemedW) {
                targetText = textUI.clearW;
            } else if (isUComplete && !redeemedU) {
                targetText = textUI.clearU;
            } else if (lastActiveSpot && spotsData[lastActiveSpot]) {
                if (collectedSpots.has(lastActiveSpot)) {
                    targetText = spotsData[lastActiveSpot].speechGet;
                } else {
                    targetText = spotsData[lastActiveSpot].speechHint;
                }
            }

            if (typeof SpeechSynthesisUtterance === 'undefined') return;
            const utter = new SpeechSynthesisUtterance(targetText);
            
            if (currentLang === 'ja') utter.lang = 'ja-JP';
            else if (currentLang === 'en') utter.lang = 'en-US';
            else if (currentLang === 'zh') utter.lang = 'zh-CN';
            else if (currentLang === 'ko') utter.lang = 'ko-KR';

            utter.rate = 0.95; 

            utter.onend = () => { updateAudioButtonText(); };
            utter.onerror = () => { updateAudioButtonText(); };

            const audioBtn = document.getElementById('audioBtn');
            const audioBtnText = document.getElementById('audioBtnText');
            if(audioBtn) audioBtn.classList.add('playing');
            if(audioBtnText) audioBtnText.innerText = textUI.audioStop;
            synth.speak(utter);
        } catch(e) {
            console.log("Speech failed", e);
        }
    }

    function stopSpeech() {
        try {
            if (synth && synth.speaking) { synth.cancel(); }
        } catch(e) {}
        updateAudioButtonText();
    }

    function updateAudioButtonText() {
        const audioBtnText = document.getElementById('audioBtnText');
        if (!audioBtnText) return;
        const textUI = spotMaster.languages[currentLang].ui;
        const btn = document.getElementById('audioBtn');
        if(btn) btn.classList.remove('playing');
        audioBtnText.innerText = textUI.audioStart;
    }

    function handleSlotClick(spotCode) {
        lastActiveSpot = spotCode;
        updateMessageArea();
        saveUserData();
        stopSpeech();
    }

    function make_clickable_or_not(spotCode) {
        handleSlotClick(spotCode);
    }

    function processStampInbound(spotCode) {
        stopSpeech();
        if (spotCode === "W-GIFT") {
            if (!redeemedW) { redeemedW = true; saveUserData(); updateGiftBadges(); updateMessageArea(); alert("わくわくコースの景品お渡しを記録しました！"); }
            return;
        }
        if (spotCode === "U-GIFT") {
            if (!redeemedU) { redeemedU = true; saveUserData(); updateGiftBadges(); updateMessageArea(); alert("うきうきコースの景品お渡しを記録しました！"); }
            return;
        }

        if (!spotMaster.images.hasOwnProperty(spotCode)) return;

        if (!collectedSpots.has(spotCode)) {
            collectedSpots.add(spotCode);
            lastActiveSpot = spotCode;
            saveUserData();
            updateStampSlotVisual(spotCode);
            updateMessageArea();
        }
    }

    function updateStampSlotVisual(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (!slot) return;

        if (collectedSpots.has(spotCode)) {
            const imgPath = spotMaster.images[spotCode];
            if (imgPath) {
                slot.innerHTML = `<img src="${imgPath}" class="stamp-image" alt="${spotCode}">`;
            } else {
                const textUI = spotMaster.languages[currentLang].ui;
                if(spotCode.endsWith("5")) {
                    slot.innerHTML = `<div class="stamp-special-mark">${textUI.stampSpecialText}</div>`;
                } else {
                    slot.innerHTML = `<div class="stamp-default-mark">${textUI.stampDefaultText}</div>`;
                }
            }
        } else {
            slot.innerHTML = spotCode.endsWith("5") ? "SP" : spotCode;
        }
    }

    function updateStampDisplayAll() {
        Object.keys(spotMaster.images).forEach(spotCode => { updateStampSlotVisual(spotCode); });
    }

    async function toggleCamera() {
        const cameraArea = document.getElementById('cameraArea');
        const video = document.getElementById('video-preview');
        const textUI = spotMaster.languages[currentLang].ui;

        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
            if(cameraArea) cameraArea.style.display = "none";
            const scanBtnText = document.getElementById('scanBtnText');
            if(scanBtnText) scanBtnText.innerText = textUI.scanBtnStart;
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                videoStream = stream;
                if(video) video.srcObject = stream;
                if(cameraArea) cameraArea.style.display = "block";
                const scanBtnText = document.getElementById('scanBtnText');
                if(scanBtnText) scanBtnText.innerText = textUI.scanBtnStop;

                // テスト用の疑似自動スキャン
                setTimeout(() => {
                    if (videoStream) {
                        const wMaster = ["W1", "W2", "W3", "W4", "W5"];
                        const isWComplete = wMaster.every(s => collectedSpots.has(s));

                        if (isWComplete && !redeemedW) {
                            alert("【テスト】わくわく景品QR (W-GIFT) を検知！");
                            processStampInbound("W-GIFT");
                        } else {
                            const available = Object.keys(spotMaster.images).filter(s => !collectedSpots.has(s));
                            if (available.length > 0) {
                                const nextSpot = available[0];
                                alert(`【テスト】QR「${nextSpot}」を検知！`);
                                processStampInbound(nextSpot);
                            }
                        }
                        toggleCamera();
                    }
                }, 2000);

            } catch (err) {
                alert("カメラの起動に失敗しました。");
            }
        }
    }

    function toggleContrast() {
        isHighContrast = !isHighContrast;
        document.body.classList.toggle('high-contrast', isHighContrast);
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        if(!btn) return;
        const textUI = spotMaster.languages[currentLang].ui;
        btn.innerText = isHighContrast ? textUI.btnNormal : textUI.btnHigh;
    }

    function resetRally() {
        stopSpeech();
        if (confirm("集めたスタンプ（W1〜W5、U1〜U5）をリセットしますか？\n（※景品交換状況は消えずに残ります）")) {
            collectedSpots.clear();
            lastActiveSpot = null; // 記憶から完全に抹消して初期状態に戻す
            saveUserData();
            updateStampDisplayAll();
            switchLang(currentLang);
        }
    }

    function checkUrlParameter() {
        const urlParams = new URLSearchParams(window.location.search);
        const spotCode = urlParams.get('spot');
        if (spotCode) {
            setTimeout(() => {
                processStampInbound(spotCode.toUpperCase());
                window.history.replaceState({}, document.title, window.location.pathname);
            }, 300);
        }
    }

    // 初期化処理
    loadUserData();
    switchLang('ja');
    checkUrlParameter();
</script>
