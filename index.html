<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく デジタルスタンプラリー</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #fff9e6; color: #4a4a4a; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.05); border: 3px solid #ffd24d; }
        
        h1 { font-size: 1.6rem; color: #ff6f61; margin: 10px 0 5px 0; font-weight: bold; }
        .description { font-size: 0.85rem; color: #7a7a7a; margin-bottom: 15px; background: #fff3cd; padding: 8px; border-radius: 10px; line-height: 1.5; }
        
        .lang-buttons { margin-bottom: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; }
        .lang-btn { background: #f0f0f0; border: 2px solid #ddd; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #666; }
        .lang-btn.active { background: #ff6f61; color: white; border-color: #ff6f61; }
        
        /* コースデザイン */
        .course-section { background: #f0fdf4; padding: 12px; border-radius: 15px; margin-bottom: 15px; border: 2px dashed #bbf7d0; }
        .course-section.course-b { background: #eff6ff; border-color: #bfdbfe; }
        .course-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .title-text-a { color: #16a34a; }
        .title-text-b { color: #2563eb; }

        /* 5マス配置（4マス+スペシャルが並ぶように調整） */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .stamp-slot { width: 100%; aspect-ratio: 1; border: 2px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; background-color: #fafafa; color: #aaa; font-weight: bold; cursor: pointer; position: relative; box-sizing: border-box; }
        
        .stamp-slot.active { border-style: solid; color: white; animation: pop 0.4s ease; }
        .slot-a.active { background: linear-gradient(135deg, #4ade80, #22c55e); border-color: #16a34a; }
        .slot-b.active { background: linear-gradient(135deg, #60a5fa, #3b82f6); border-color: #2563eb; }
        
        /* スペシャル枠スタイル */
        .slot-special { border-color: #fcd34d; background-color: #fffbeb; color: #fbbf24; border-width: 2px; }
        .slot-special.active { background: linear-gradient(135deg, #fbbf24, #f59e0b); border-color: #d97706; color: white; }

        /* ヒント表示 */
        .hint-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; min-height: 45px; margin-top: 15px; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        .hint-popup { color: #ff6f61; }
        .link-text { color: #2563eb; text-decoration: underline; cursor: pointer; }

        .reset-btn { margin-top: 25px; background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; color: #bbb; cursor: pointer; }
        
        /* わくわく1（旧A1）獲得時のお家イラスト */
        #stamp-w1.active::after { content: '🏠'; font-size: 1.6rem; position: absolute; }
        
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-buttons">
        <button class="lang-btn active" onclick="setLanguage('ja')">日本語</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
        <button class="lang-btn" onclick="setLanguage('ko')">한국어</button>
    </div>

    <h1 id="title">わくわく スタンプラリー</h1>
    <div id="desc" class="description">ビルをたんけんしてスタンプをあつめよう！<br>まるをタップするとヒントがみられるよ！</div>

    <div class="course-section">
        <div id="title-a" class="course-title title-text-a">🟢 わくわくコース</div>
        <div class="grid">
            <div id="stamp-w1" class="stamp-slot slot-a" onclick="clickStamp('w1')">W1</div>
            <div id="stamp-w2" class="stamp-slot slot-a" onclick="clickStamp('w2')">W2</div>
            <div id="stamp-w3" class="stamp-slot slot-a" onclick="clickStamp('w3')">W3</div>
            <div id="stamp-w4" class="stamp-slot slot-a" onclick="clickStamp('w4')">W4</div>
            <div id="stamp-w5" class="stamp-slot slot-a slot-special" onclick="clickStamp('w5')">★</div>
        </div>
    </div>

    <div class="course-section course-b">
        <div id="title-b" class="course-title title-text-b">🔵 うきうきコース</div>
        <div class="grid">
            <div id="stamp-u1" class="stamp-slot slot-b" onclick="clickStamp('u1')">U1</div>
            <div id="stamp-u2" class="stamp-slot slot-b" onclick="clickStamp('u2')">U2</div>
            <div id="stamp-u3" class="stamp-slot slot-b" onclick="clickStamp('u3')">U3</div>
            <div id="stamp-u4" class="stamp-slot slot-b" onclick="clickStamp('u4')">U4</div>
            <div id="stamp-u5" class="stamp-slot slot-b slot-special" onclick="clickStamp('u5')">★</div>
        </div>
    </div>

    <div id="hint-area" class="hint-box">
        <span id="hint-text">スタンプのまるをタップしてみてね！</span>
    </div>

    <button id="btn-reset" class="reset-btn" onclick="resetStamps()">リセット</button>
</div>

<script>
    // 施設HPのリンク先設定
    const shopUrls = {
        w1: "https://www.kodomo-how.com/", // わくわく1は子ども館
        w2: "https://example.com", w3: "https://example.com", w4: "https://example.com", w5: "https://example.com",
        u1: "https://example.com", u2: "https://example.com", u3: "https://example.com", u4: "https://example.com", u5: "https://example.com"
    };

    // 4ヶ国語データ（コース名：わくわく／うきうき版）
    const translations = {
        ja: {
            title: "わくわく スタンプラリー", desc: "ビルをたんけんしてスタンプをあつめよう！<br>まるをタップするとヒントがみられるよ！", courseA: "🟢 わくわくコース", courseB: "🔵 うきうきコース", reset: "リセット",
            hints: {
                click_get: "💡スタンプゲット済み！<br><span class='link-text'>👇 タップしてホームページをみてね！</span>",
                default: "スタンプのまるをタップしてみてね！",
                w1: "【ヒント】ちか1かい の 「子ども館」の 入口の ちかくに あるよ！",
                w2: "【ヒント】2かい の エレベーターの ちかくを ささがしてね！",
                w3: "【ヒント】3かい の 広場（ひろば）の なかに あるよ！",
                w4: "【ヒント】5かい の お店の ちかくを まわってみよう！",
                w5: "【スペシャルヒント】なんと 7かい の とくべつな ばしょ にあるよ！",
                u1: "【ヒント】1かい の 正面玄関（しょうめんげんかん）の ちかくに あるよ！",
                u2: "【ヒント】2かい の 通路（つうろ）の かべを みてみよう！",
                u3: "【ヒント】3かい の すこし おくまった ばしょ にあるよ！",
                u4: "【ヒント】5かい の 休憩スペース（きゅうけい）の ちかくにあるよ！",
                u5: "【スペシャルヒント】7かい の 展望（てんぼう）テラス を さがしてみよう！"
            }
        },
        en: {
            title: "WakuWaku Stamp Rally", desc: "Explore the building and collect stamps!<br>Tap the circles to see hints!", courseA: "🟢 WakuWaku Course", courseB: "🔵 UkiUki Course", reset: "Reset",
            hints: {
                click_get: "💡 Stamp Collected!<br><span class='link-text'>👇 Tap to view the website!</span>",
                default: "Tap a circle to see the hint!",
                w1: "[Hint] Near the entrance of Children's Hall on the B1 Floor!",
                w2: "[Hint] Check near the elevator on the 2nd Floor!",
                w3: "[Hint] Inside the open space on the 3rd Floor!",
                w4: "[Hint] Walk around the shops on the 5th Floor!",
                w5: "[Special Hint] It's hidden in a special place on the 7th Floor!",
                u1: "[Hint] Near the main entrance on the 1st Floor!",
                u2: "[Hint] Look at the walls along the hallway on the 2nd Floor!",
                u3: "[Hint] Tucked away in a corner on the 3rd Floor!",
                u4: "[Hint] Near the rest area on the 5th Floor!",
                u5: "[Special Hint] Let's find it at the Observation Terrace on the 7th Floor!"
            }
        },
        zh: { title: "欢欣雀跃 集章活動", desc: "探索大楼并收集印章！<br>点击圆圈查看提示！", courseA: "🟢 欢欣雀跃路线", courseB: "🔵 无忧无虑路线", reset: "重置", hints: { click_get: "💡 已获得印章！<br><span class='link-text'>👇 点击查看官方网站！</span>", default: "点击圆圈查看提示！", w1: "【提示】在地下一层（B1）的儿童馆入口附近！", w2: "【提示】2楼的电梯附近！", w3: "【提示】3楼的广场里面哦！", w4: "【提示】5楼的商店附近！", w5: "【特别提示】竟然在7楼的一个特别地方！", u1: "【提示】1楼正门大厅附近！", u2: "【提示】2楼走廊的墙壁上！", u3: "【提示】3楼角落稍微隐蔽的地方！", u4: "【提示】5楼休息区附近！", u5: "【特别提示】去7楼的展望台找找看吧！" } },
        ko: { title: "두근두근 스탬프 랠리", desc: "빌딩을 탐험하며 스탬프를 모으자!<br>원을 탭하면 힌트를 볼 수 있어!", courseA: "🟢 와쿠와쿠 코스", courseB: "🔵 우키우키 코스", reset: "리셋", hints: { click_get: "💡 스탬프 획득 완료!<br><span class='link-text'>👇 탭하여 홈페이지를 확인해봐!</span>", default: "스탬프 원을 탭해 보세요!", w1: "【힌트】지하 1층 어린이관 입구 근처에 있어!", w2: "【힌트】2층 엘리베이터 근처!", w3: "【힌트】3층 광장 안에 있어!", w4: "【힌트】5층 매장 근처를 돌아봐!", w5: "【스페셜 힌트】무려 7층 특별한 장소에 있어!", u1: "【힌트】1층 정문 현관 근처에 있어!", u2: "【힌트】2층 복도 벽면을 확인해봐!", u3: "【힌트】3층 안쪽 구석진 장소에 있어!", u4: "【힌트】5층 휴게 공간 근처에 있어!", u5: "【스페셜 힌트】7층 전망 테라스를 찾아보자!" } }
    };

    let currentLang = 'ja';

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('title').innerHTML = translations[lang].title;
        document.getElementById('desc').innerHTML = translations[lang].desc;
        document.getElementById('title-a').innerHTML = translations[lang].courseA;
        document.getElementById('title-b').innerHTML = translations[lang].courseB;
        document.getElementById('btn-reset').innerHTML = translations[lang].reset;
        document.getElementById('hint-text').innerHTML = translations[currentLang].hints.default;
        updateStampDisplay();
    }

    function clickStamp(id) {
        const stamps = JSON.parse(localStorage.getItem('digital-stamp-rally') || '{}');
        const hintArea = document.getElementById('hint-text');
        if (stamps[id]) {
            // 指マークの部分をクリックするとHPに飛ぶ
            hintArea.innerHTML = `<span class="hint-popup" onclick="window.open('${shopUrls[id]}', '_blank')">${translations[currentLang].hints.click_get}</span>`;
        } else {
            hintArea.innerHTML = `<span class="hint-popup">${translations[currentLang].hints[id]}</span>`;
        }
    }

    function updateStampDisplay() {
        const stamps = JSON.parse(localStorage.getItem('digital-stamp-rally') || '{}');
        
        // わくわくコース(W1~W5)の更新
        ['w1','w2','w3','w4','w5'].forEach(id => {
            const slot = document.getElementById('stamp-' + id);
            if (stamps[id]) {
                slot.classList.add('active');
                slot.innerText = (id === 'w1') ? "" : "✓";
            } else {
                slot.classList.remove('active');
                slot.innerText = (id === 'w5') ? '★' : id.toUpperCase();
            }
        });

        // うきうきコース(U1~U5)の更新
        ['u1','u2','u3','u4','u5'].forEach(id => {
            const slot = document.getElementById('stamp-' + id);
            if (stamps[id]) {
                slot.classList.add('active');
                slot.innerText = "✓";
            } else {
                slot.classList.remove('active');
                slot.innerText = (id === 'u5') ? '★' : id.toUpperCase();
            }
        });
    }

    function checkURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot');
        
        // 旧パラメーター(a1, b1等)が来ても動くように互換性を持たせる
        let mappedId = spotId;
        if (spotId === 'a1') mappedId = 'w1';
        if (spotId === 'a2') mappedId = 'w2';
        if (spotId === 'a3') mappedId = 'w3';
        if (spotId === 'a4') mappedId = 'w5'; // 旧スペシャルA
        if (spotId === 'b1') mappedId = 'u1';
        if (spotId === 'b2') mappedId = 'u2';
        if (spotId === 'b3') mappedId = 'u3';
        if (spotId === 'b4') mappedId = 'u5'; // 旧スペシャルB

        if (mappedId) {
            let stamps = JSON.parse(localStorage.getItem('digital-stamp-rally') || '{}');
            stamps[mappedId] = true;
            localStorage.setItem('digital-stamp-rally', JSON.stringify(stamps));
            const cleanURL = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({}, document.title, cleanURL);
            setTimeout(() => {
                document.getElementById('hint-text').innerHTML = `<span class="hint-popup">🎉 スタンプゲット！まるをタップしてみてね！</span>`;
            }, 500);
        }
        updateStampDisplay();
    }

    function resetStamps() {
        if (confirm('スタンプをすべて消去しますか？')) {
            localStorage.removeItem('digital-stamp-rally');
            document.getElementById('hint-text').innerHTML = translations[currentLang].hints.default;
            updateStampDisplay();
        }
    }

    window.onload = checkURL;
</script>
</body>
</html>
