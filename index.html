<style>
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f7ebd3;color:#333;margin:0;padding:20px 10px;display:flex;justify-content:center}
.container{max-width:500px;width:100%;background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:25px 15px;text-align:center;box-sizing:border-box;border:4px solid #ffcc00}
.lang-buttons{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:15px}
.lang-btn{background:#e0e0e0;border:none;padding:6px 12px;border-radius:15px;cursor:pointer;font-size:13px;font-weight:bold}
.lang-btn.active{background:#ff5a5f;color:#fff}
.top-banner-img{width:100%;height:auto;border-radius:12px;display:block;margin:0 0 5px}
.sub-title-text{font-size:16px;font-weight:bold;color:#ff5a5f;margin:5px 0 15px;display:none}
.thanks{background:#fff5da;border:1px solid #fed7aa;border-radius:12px;padding:16px 14px;margin:15px 0 12px;font-size:16px;font-weight:bold;line-height:1.7;color:#665544}
.notice{background:#fee2e2;border:2px solid #fca5a5;color:#b91c1c;border-radius:10px;padding:10px;font-size:14px;font-weight:bold;margin-bottom:22px}
.course-section{border-radius:15px;padding:15px 10px;margin-bottom:20px;box-sizing:border-box;text-align:left}
.course-w{background:#f0fdf4;border:2px dashed #4ade80}
.course-u{background:#eff6ff;border:2px dashed #60a5fa}
.course-title{font-weight:bold;font-size:18px;margin-bottom:12px;text-align:center}
.course-w .course-title{color:#166534}
.course-u .course-title{color:#1e40af}
.spot{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-bottom:10px}
.spot:last-child{margin-bottom:0}
.spot img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid #ff5a5f;box-sizing:border-box}
.spot-name{font-size:15px;font-weight:bold;margin-bottom:2px}
.spot-msg{font-size:13px;color:#666;line-height:1.5}
.link-btn{display:inline-block;background:#3b82f6;color:#fff!important;text-decoration:none;padding:5px 14px;font-size:13px;border-radius:20px;margin-top:6px;font-weight:bold}
.access{width:100%;max-width:320px;margin:0 auto 15px;display:flex;flex-direction:column;gap:8px}
.audio-btn{width:100%;background:#0284c7;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.audio-btn.playing{background:#ef4444}
.contrast-btn{width:100%;background:#222;color:#fff;border:2px solid #000;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
body.hc{background:#000!important;color:#fff!important}
body.hc .container{background:#000!important;color:#fff!important;border:5px solid #fff!important}
body.hc .lang-btn{background:#333!important;color:#fff!important;border:2px solid #fff!important}
body.hc .lang-btn.active{background:#fff!important;color:#000!important;border:3px solid #fff!important}
body.hc .audio-btn{background:#fff!important;color:#000!important;border:3px solid #fff!important}
body.hc .audio-btn.playing{background:#ff5a5f!important;color:#fff!important}
body.hc .contrast-btn{background:#fff!important;color:#000!important;border:4px solid #fff!important}
body.hc .sub-title-text{color:#fff!important}
body.hc .thanks,body.hc .notice{background:#000!important;color:#fff!important;border:3px solid #fff!important}
body.hc .course-section{background:#000!important;border:4px solid #fff!important}
body.hc .course-title{color:#fff!important}
body.hc .spot{background:#000!important;border:2px solid #fff}
body.hc .spot-msg{color:#fff!important}
body.hc .spot img{border-color:#fff}
body.hc .link-btn{background:#fff!important;color:#000!important}
</style>
</head>
<body>
<div class="container">
  <div class="lang-buttons">
    <button class="lang-btn active" id="btn-ja" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">简体中文</button>
    <button class="lang-btn" id="btn-ko" onclick="setLang('ko')">한국어</button>
  </div>
  <div class="access">
    <button class="audio-btn" id="audioBtn" onclick="toggleSpeech()">🔊 <span id="audioTxt"></span></button>
    <button class="contrast-btn" id="contrastBtn" onclick="toggleContrast()"></button>
  </div>
  <img src="top.png" alt="ひとみらい★フェスタ" class="top-banner-img">
  <div class="sub-title-text" id="sub"></div>
  <div class="thanks" id="thanks"></div>
  <div class="notice" id="notice"></div>
  <div class="course-section course-w"><div class="course-title" id="titleW"></div><div id="listW"></div></div>
  <div class="course-section course-u"><div class="course-title" id="titleU"></div><div id="listU"></div></div>
</div>
<script>
const imgs={W1:"HOW_logo_W1.png",W2:"W2.png",W3:"W3.png",W4:"W4.png",U1:"U1.jpg",U2:"U2.png",U3:"U3.png",U4:"U4.jpg"};

const L={
ja:{as:"おんせいガイドを聴く",ap:"おんせいを止める",cn:"👁️ みやすさ：通常（カラー）",ch:"👁️ みやすさ：はっきり（白黒）",sp:"2026年のひとみらいフェスタは終了しました。たくさんのご参加ありがとうございました。来年もぜひご参加ください。このページは、10月23日、金曜日以降は見れなくなります。",vl:"ja-JP",sub:"",thanks:"2026年のひとみらいフェスタは終了しました。<br>たくさんのご参加ありがとうございました。<br>来年もぜひご参加ください。",notice:"このページは10/23（金）以降は見れなくなります。",cw:"🟢 わくわくコース",cu:"🔵 うきうきコース",go:"ホームページをみる 🔗",
s:{W1:["北九州市立子どもの館","子どもの楽しいが詰まった屋内遊戯施設♪"],W2:["北九州市立ユースステーション","ユース（若者・青少年）のためのサードプレイス！"],W3:["北九州国際交流協会","北九州市多文化共生ワンストップインフォメーションセンター"],W4:["市民活動サポートセンター","NPOや市民活動団体のサポートを行っています"],U1:["西部障害者福祉会館","障害のある方の活動や暮らしに寄り添いサポートします。"],U2:["若者ワークプラザ北九州・黒崎","概ね40歳までの若者・学生と就職氷河期世代のための就職支援拠点"],U3:["シルバー人材センター西部出張所","健康で働く意欲のある高年齢者をサポートしています。"],U4:["八幡西生涯学習センター","まなび、つながり、ひろがる拠点。"]}},
en:{as:"Listen to the Audio Guide",ap:"Stop the Audio Guide",cn:"👁️ View: Normal",ch:"👁️ View: High Contrast",sp:"Hitomirai Festa 2026 has ended. Thank you very much for taking part. We hope to see you again next year! This page will no longer be available after Friday, October 23.",vl:"en-US",sub:"Hitomirai Festa 2026",thanks:"Hitomirai Festa 2026 has ended.<br>Thank you very much for taking part.<br>We hope to see you again next year!",notice:"This page will no longer be available after Friday, October 23.",cw:"🟢 Wakuwaku Course",cu:"🔵 Ukiuki Course",go:"Website 🔗",
s:{W1:["Kodomo no Yakata","Indoor play facility filled with child-friendly fun!"],W2:["Youth Station","Third place for youth!"],W3:["Kitakyushu International Association","Kitakyushu City Information Center for Foreigners"],W4:["Civic Activity Support Center","Supporting NPOs and civic activities"],U1:["Welfare Center for Persons with Disabilities","Supporting daily life and activities"],U2:["Youth Work Plaza","Employment support center for young people"],U3:["Silver Human Resources Center","Supporting senior workers"],U4:["Yahatanishi Lifelong Learning Center","A place for learning and connecting"]}},
zh:{as:"听取语音指南",ap:"停止语音",cn:"👁️ 视觉：普通（彩色）",ch:"👁️ 视觉：清晰（黑白）",sp:"2026年Hitomirai Festa已经结束。感谢大家的参与。期待明年再次相见！本页面将于10月23日，周五之后关闭。",vl:"zh-CN",sub:"Hitomirai Festa 2026",thanks:"2026年Hitomirai Festa已经结束。<br>感谢大家的参与。<br>期待明年再次相见！",notice:"本页面将于10月23日（周五）之后关闭。",cw:"🟢 欢乐路线",cu:"🔵 无忧路线",go:"访问官方网站 🔗",
s:{W1:["北九州市立儿童馆","室内游乐设施♪"],W2:["青少年驿站","青少年的空间！"],W3:["北九州国际交流协会","北九州市 外国人咨询中心"],W4:["市民活动服务中心","支持NPO与市民活动"],U1:["西部残疾人福利会馆","支持残疾人生活的设施"],U2:["青年就业广场","青年就职支援拠点"],U3:["银发人才中心","支持高龄者就职"],U4:["八幡西生涯学习中心","学习与交流的基地"]}},
ko:{as:"음성 가이드 듣기",ap:"음성 중지",cn:"👁️ 보기: 보통 (컬러)",ch:"👁️ 보기: 또렷하게 (흑백)",sp:"2026년 Hitomirai Festa가 종료되었습니다. 많은 참여 감사드립니다. 내년에도 꼭 참여해 주세요! 이 페이지는 10월 23일, 금요일 이후에는 볼 수 없습니다.",vl:"ko-KR",sub:"Hitomirai Festa 2026",thanks:"2026년 Hitomirai Festa가 종료되었습니다.<br>많은 참여 감사드립니다.<br>내년에도 꼭 참여해 주세요!",notice:"이 페이지는 10월 23일(금) 이후에는 볼 수 없습니다.",cw:"🟢 두근두근 코스",cu:"🔵 신나고 코스",go:"홈페이지 보기 🔗",
s:{W1:["기타큐슈 시립 어린이 집","실내 놀이 시설♪"],W2:["청소년 스테이션","청소년을 위한 공간!"],W3:["기타큐슈 국제교류협회","외국인 인포메이션센터"],W4:["시민활동 지원센터","시민활동 및 NPO 지원"],U1:["서부 장애인 복지회관","장애인 활동 및 생활 지원"],U2:["청년 워크 프라자","청년 취업 지원 거점"],U3:["실버 인재 센터","고령자 취업 지원"],U4:["야하타니시 평생학습센터","배움과 연결의 거점"]}}
};
function card(c,t){var d=L[t].s[c];return '<div class="spot"><img src="'+imgs[c]+'" alt="'+c+'"><div><div class="spot-name">'+d[0]+'</div><div class="spot-msg">'+d[1]+'</div><a class="link-btn" href="'+urls[c]+'" target="_blank" rel="noopener">'+L[t].go+'</a></div></div>';}
var cur='ja',hc=false,synth=(window.speechSynthesis||null);
function stopSpeech(){try{if(synth&&synth.speaking)synth.cancel()}catch(e){}refreshAudio()}
function refreshAudio(){document.getElementById('audioBtn').classList.remove('playing');document.getElementById('audioTxt').innerText=L[cur].as}
function toggleSpeech(){
  if(!synth||typeof SpeechSynthesisUtterance==='undefined'){alert("このブラウザは音声読み上げに対応していません。");return}
  try{
    if(synth.speaking){stopSpeech();return}
    var u=new SpeechSynthesisUtterance(L[cur].sp);
    u.lang=L[cur].vl;u.rate=0.95;
    u.onend=refreshAudio;u.onerror=refreshAudio;
    document.getElementById('audioBtn').classList.add('playing');
    document.getElementById('audioTxt').innerText=L[cur].ap;
    synth.speak(u);
  }catch(e){}
}
function toggleContrast(){hc=!hc;document.body.classList.toggle('hc',hc);refreshContrast()}
function refreshContrast(){document.getElementById('contrastBtn').innerText=hc?L[cur].cn:L[cur].ch}
function setLang(t){
  stopSpeech();cur=t;
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('btn-'+t).classList.add('active');
  document.documentElement.lang=t;
  var x=L[t],sub=document.getElementById('sub');
  sub.innerText=x.sub;sub.style.display=x.sub?'block':'none';
  document.getElementById('thanks').innerHTML=x.thanks;
  document.getElementById('notice').innerText=x.notice;
  document.getElementById('titleW').innerText=x.cw;
  document.getElementById('titleU').innerText=x.cu;
  document.getElementById('listW').innerHTML=['W1','W2','W3','W4'].map(function(c){return card(c,t)}).join('');
  document.getElementById('listU').innerHTML=['U1','U2','U3','U4'].map(function(c){return card(c,t)}).join('');
  refreshAudio();refreshContrast();
}
setLang('ja');
</script>
