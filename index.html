            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .lang-btn.active { background-color: #ff5a5f; color: white; }
        
        /* 🔊 音声・アクセシビリティエリア */
        .accessibility-box {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .audio-btn {
            width: 100%; background-color: #0284c7; color: #ffffff; border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .audio-btn.playing { background-color: #ef4444; }
        .contrast-toggle-btn {
            width: 100%; background-color: #222222; color: #ffffff; border: 2px solid #000000;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { color: #ff5a5f; margin: 10px 0; font-size: 24px; }
        .info-text {
            background-color: #fff5da; padding: 12px; border-radius: 10px; font-size: 14px;
            margin-bottom: 20px; color: #665544; line-height: 1.5; text-align: left;
        }

        .scan-btn {
            background-color: #ff5a5f; color: white; border: none; padding: 14px 28px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4); margin-bottom: 20px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .camera-container {
            display: none; position: relative; width: 100%; max-width: 320px;
            margin: 0 auto 20px auto; border: 3px solid #ff5a5f; border-radius: 12px;
            overflow: hidden; background-color: #000;
        }
        #video-preview { width: 100%; height: auto; display: block; }
        .camera-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%; border: 2px dashed #ff5a5f;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none;
        }

        /* コースエリア */
        .course-section { border-radius: 15px; padding: 15px 10px; margin-bottom: 20px; box-sizing: border-box; }
        .course-w { background-color: #f0fdf4; border: 2px dashed #4ade80; }
        .course-u { background-color: #eff6ff; border: 2px dashed #60a5fa; }
        .course-title { font-weight: bold; font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目 */
        .stamp-grid { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px; overflow-x: auto; }
        .stamp-slot {
            width: 55px; height: 55px; border-radius: 50%; background-color: #ffffff; border: 2px dotted #cccccc;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999999; font-weight: bold;
            position: relative; flex-shrink: 0; box-sizing: border-box; cursor: pointer; user-select: none;
        }
        .stamp-slot.special { border: 2px dashed #a855f7; background-color: #faf5ff; color: #a855f7; font-size: 11px; }
        .stamp-image { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .stamp-default-mark {
            width: 100%; height: 100%; border-radius: 50%; background-color: #ffebd3; border: 2px solid #ff5a5f;
            color: #ff5a5f; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; box-sizing: border-box;
        }
        .stamp-special-mark {
            width: 100%; height: 100%; border-radius: 50%; background-color: #f3e8ff; border: 2px solid #a855f7;
            color: #a855f7; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; box-sizing: border-box;
        }

        /* 状態メッセージエリア */
        .status-msg {
            background-color: #f3f4f6; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: bold;
            margin-top: 10px; border: 1px solid #e5e7eb; min-height: 60px;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
        }
        .facility-link-btn {
            display: inline-block; background-color: #3b82f6; color: white !important; text-decoration: none;
            padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 5px; font-weight: bold;
        }

        /* 📦 画面最下部：景品交換状況エリア */
        .gift-status-section {
            margin-top: 25px; padding: 15px; background-color: #f8fafc; border: 3px solid #cbd5e1; border-radius: 15px; text-align: left;
        }
        .gift-status-title { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 10px; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .gift-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; }
        .gift-row:last-child { border-bottom: none; }
        .gift-name { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .gift-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-align: center; }
        .gift-badge.yet { background-color: #e2e8f0; color: #64748b; border: 1px solid #cbd5e1; }
        .gift-badge.done { background-color: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; font-size: 13px; }

        .reset-btn { background-color: transparent; color: #9ca3af; border: 1px solid #d1d5db; padding: 5px 15px; font-size: 12px; border-radius: 10px; cursor: pointer; margin-top: 20px; }

</head>

    <h1 id="mainTitle">わくわく スタンプラリー（テスト用）</h1>

        各スポットにあるQRコードを読み取るとスタンプが押されるよ！<br>
        ゴール特典の景品は先着順となります。無くなり次第終了となりますのでご了承ください。
    </div>

    <button class="scan-btn" onclick="toggleCamera()" id="scanBtn">
        📷 <span id="scanBtnText">QRコードを読み取る</span>
    </button>
    <div class="camera-container" id="cameraArea">

    </div>

        <div class="stamp-grid">

            <div class="stamp-slot" id="slot-W2" onclick="handleSlotClick('W2')">W2</div>

            <div class="stamp-slot special" id="slot-W5" onclick="handleSlotClick('W5')">SP</div>
        </div>
    </div>

    <div class="course-section course-u">

            <div class="stamp-slot special" id="slot-U5" onclick="handleSlotClick('U5')">SP</div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">QRコードをよみとってスタンプをあつめよう！</div>

    <div class="gift-status-section">
        <div class="gift-status-title" id="giftTitle">🎁 景品交換状況</div>
        <div class="gift-row">

            <span class="gift-badge yet" id="badge-W">未受け取り</span>
        </div>
        <div class="gift-row">

            <span class="gift-badge yet" id="badge-U">未受け取り</span>

    </div>

    <button class="reset-btn" onclick="resetRally()" id="resetBtn">最初からやり直す</button>
</div>
