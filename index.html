        /* --- 基本デザイン（通常モード） --- */
        body {

            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        /* コントロールパネル（言語・アクセシビリティ） */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .lang-btn.active {
            background-color: #ff5a5f;
            color: white;
        }

        /* 👁️ みやすさ切り替えボタン */
        .accessibility-box {
            width: 100%;
            max-width: 300px;
        }
        .contrast-toggle-btn {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff5a5f;
            margin: 10px 0;
            font-size: 26px;
        }
        .info-text {
            background-color: #fff5da;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            color: #665544;
            line-height: 1.5;
            text-align: left;
        }
        
        /* スキャンボタン */
        .scan-btn {
            background-color: #ff5a5f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4);
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* コースエリア */
        .course-section {
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .course-w {
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
        }
        .course-u {
            background-color: #eff6ff;
            border: 2px dashed #60a5fa;
        }
        .course-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目の並び */
        .stamp-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 5px;
            overflow-x: auto;
        }
        .stamp-slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px dotted #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999999;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
            cursor: pointer;
        }
        .stamp-slot.goal {
            border: 2px dashed #fbbf24;
            background-color: #fffdf5;
            color: #fbbf24;
            font-size: 16px;
            cursor: default;
        }
        
        .stamp-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 状態メッセージ・情報表示エリア */
        .status-msg {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #e5e7eb;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }

        /* エリア内に出るホームページボタン */
        .facility-link-btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white !important;
            text-decoration: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 20px;
            margin-top: 5px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
            font-weight: bold;
        }

        .reset-btn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #d1d5db;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* --- 👁️ 高コントラストモードスタイル --- */
        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;

            background-color: #000000 !important;
            color: #ffffff !important;
            border: 5px solid #ffffff !important;
        }

            color: #000000 !important;

            color: #ffffff !important;

            border: 3px solid #ffffff !important;

            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast .scan-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
            font-size: 22px !important;
        }
        body.high-contrast .course-section {
            background-color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .course-title { color: #ffffff !important; font-size: 22px !important; }

            background-color: #000000 !important;

            border: 2px solid #ffffff !important;
            font-size: 14px !important;

            btnHigh: "👁️ View: High Contrast",
            goWeb: "Visit Website 🔗"
        },
        zh: {
            title: "集章拉力赛",
            info: "扫描QR码即可获得印章！<br>终点奖品数量有限（先到先得前〇〇名）。奖品发完即止，敬请谅解。",
            scan: "扫描QR码",
            courseW: "Wakuwaku 路线",
            courseU: "Ukiuki 路线",
            hint: "扫描QR码来收集印章！",
            clearW: "<strong>Wakuwaku 路线完成！快来领取奖品吧！</strong>",
            reset: "重置",
            btnNormal: "👁️ 视角: 普通（彩色）",
            btnHigh: "👁️ 视角: 高对比度（黑白）",
            goWeb: "访问官方网站 🔗"
        },
        ko: {
            title: "두근두근 스탬프 랠리",
            info: "QR 코드를 스캔하면 스탬프 GET!<br>골 달성 사은품은 선착순 OO명 한정입니다. 사은품이 소진되는 대로 종료되오니 양해 바랍니다.",
            scan: "QR 코드 스캔",
            courseW: "와쿠와쿠 코스",
            courseU: "우키우키 코스",
            hint: "QR 코드를 스캔하여 스탬프를 모으세요!",
            clearW: "<strong>와쿠와쿠 코스 클리어! 경품을 받으세요!</strong>",
            reset: "리셋",
            btnNormal: "👁️ 보기: 일반 (컬러)",
            btnHigh: "👁️ 보기: 고대비 (흑백)",
            goWeb: "홈페이지 보기 🔗"
        }
    };

    let currentLang = 'ja';
    let isHighContrast = false;
    let lastActiveSpot = null;          
    let isCleared = false;              
    const collectedSpots = new Set();  

    function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        document.getElementById('mainTitle').innerText = i18n[lang].title;
        document.getElementById('infoText').innerHTML = i18n[lang].info;
        document.getElementById('scanBtnText').innerText = i18n[lang].scan;
        document.getElementById('titleW').innerText = i18n[lang].courseW;
        document.getElementById('titleU').innerText = i18n[lang].courseU;
        document.getElementById('resetBtn').innerText = i18n[lang].reset;
        
        updateMessageArea();
        updateContrastButtonText();
    }

    function updateMessageArea() {
        const statusEl = document.getElementById('statusMsg');
        
        if (isCleared) {
            statusEl.innerHTML = i18n[currentLang].clearW;
            return;
        }

        if (lastActiveSpot) {
            if (collectedSpots.has(lastActiveSpot)) {
                const detail = spotDetails[currentLang][lastActiveSpot];
                statusEl.innerHTML = `
                    <div><strong>🎉【${detail.name}】GET!</strong></div>
                    <div style="font-size: 13px; font-weight: normal; color: #666; margin: 2px 0;">${detail.message}</div>
                    <a href="${detail.url}" target="_blank" class="facility-link-btn">${i18n[currentLang].goWeb}</a>
                `;
            } else {
                statusEl.innerText = hintTexts[currentLang][lastActiveSpot];
            }
        } else {
            statusEl.innerText = i18n[currentLang].hint;
        }
    }

    function handleSlotClick(spotCode) {
        lastActiveSpot = spotCode;
        updateMessageArea();
    }

    function toggleContrast() {
        isHighContrast = !isHighContrast;
        if (isHighContrast) {
            document.body.classList.add('high-contrast');
        } else {
            document.body.classList.remove('high-contrast');
        }
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        if (isHighContrast) {
            btn.innerText = i18n[currentLang].btnNormal;
        } else {
            btn.innerText = i18n[currentLang].btnHigh;
        }
    }

    // --- 【打合せデモ用ロジック】 ---
    let demoIndex = 0;
    const demoSpots = ["W1", "W2", "W3", "W4", "U1"];

    function simulateScan() {
        if (demoIndex < demoSpots.length) {
            const currentSpot = demoSpots[demoIndex];
            alert(`【デモ動作】QRコードから「${currentSpot}」を検出しました！スタンプを押します。`);
            stampPressed(currentSpot);
            demoIndex++;
        } else {
            alert("デモ用のスタンプは押し終わりました。一度リセットしてください。");
        }
    }

    function stampPressed(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (slot && !collectedSpots.has(spotCode)) {
            collectedSpots.add(spotCode);
            slot.innerHTML = `<img src="HOW_logo_W1.png" class="stamp-image" alt="${spotCode}">`;
            lastActiveSpot = spotCode;
            updateMessageArea();
            checkGoal();
        }
    }

    function checkGoal() {
        const wSpots = ["W1", "W2", "W3", "W4"];
        const isWComplete = wSpots.every(spot => collectedSpots.has(spot));
        
        if (isWComplete) {
            isCleared = true;
            document.getElementById('slot-W-goal').innerText = "🎉";
            updateMessageArea();
        }
    }

    function resetRally() {
        localStorage.clear();
        location.reload();
    }

    // 初期化
    switchLang('ja');
</script>

</body>
</html>
