<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく デジタルスタンプラリー</title>
    <style>
        /* --- 基本デザイン（通常モード） --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        /* コントロールパネル（言語・アクセシビリティ） */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .lang-btn.active {
            background-color: #ff5a5f;
            color: white;
        }

        /* 👁️ みやすさ切り替えボタン */
        .accessibility-box {
            width: 100%;
            max-width: 300px;
        }
        .contrast-toggle-btn {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff5a5f;
            margin: 10px 0;
            font-size: 26px;
        }
        .info-text {
            background-color: #fff5da;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            color: #665544;
            line-height: 1.5;
            text-align: left; /* 先着案内を読みやすくするため左寄せに調整 */
        }
        
        /* スキャンボタン */
        .scan-btn {
            background-color: #ff5a5f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4);
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* コースエリア */
        .course-section {
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .course-w {
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
        }
        .course-u {
            background-color: #eff6ff;
            border: 2px dashed #60a5fa;
        }
        .course-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目の並び */
        .stamp-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 5px;
            overflow-x: auto;
        }
        .stamp-slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px dotted #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999999;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
            cursor: pointer;
        }
        .stamp-slot.goal {
            border: 2px dashed #fbbf24;
            background-color: #fffdf5;
            color: #fbbf24;
            font-size: 16px;
            cursor: default;
        }
        
        /* 押されたスタンプ（リンクの入る枠） */
        .stamp-link {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
        }
        .stamp-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-msg {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #e5e7eb;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .reset-btn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #d1d5db;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* --- 👁️ 高コントラストモードスタイル --- */
        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        body.high-contrast .container {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 5px solid #ffffff !important;
        }
        body.high-contrast .contrast-toggle-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .lang-btn {
            background-color: #333333 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
        }
        body.high-contrast .lang-btn.active {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast h1 { color: #ffffff !important; font-weight: 900 !important; }
        body.high-contrast .info-text {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
        }
        body.high-contrast .scan-btn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 4px solid #ffffff !important;
            font-size: 22px !important;
        }
        body.high-contrast .course-section {
            background-color: #000000 !important;
            border: 4px solid #ffffff !important;
        }
        body.high-contrast .course-title { color: #ffffff !important; font-size: 22px !important; }
        body.high-contrast .stamp-slot {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
            width: 65px !important;
            height: 65px !important;
            font-size: 16px !important;
        }
        body.high-contrast .stamp-slot.goal { border: 4px double #ffffff !important; color: #ffffff !important; }
        body.high-contrast .stamp-image {
            filter: contrast(150%) brightness(110%);
            border: 2px solid #ffffff;
        }
        body.high-contrast .status-msg {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 3px solid #ffffff !important;
            font-size: 18px !important;
        }
        body.high-contrast .reset-btn {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            font-size: 14px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- コントロールパネル -->
    <div class="control-panel">
        <div class="lang-buttons">
            <button class="lang-btn active" id="btn-ja" onclick="switchLang('ja')">日本語</button>
            <button class="lang-btn" id="btn-en" onclick="switchLang('en')">English</button>
            <button class="lang-btn" id="btn-zh" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" id="btn-ko" onclick="switchLang('ko')">한국어</button>
        </div>
        
        <div class="accessibility-box">
            <button class="contrast-toggle-btn" onclick="toggleContrast()" id="contrastBtn">
                👁️ みやすさ：通常（カラー）
            </button>
        </div>
    </div>

    <h1 id="mainTitle">わくわく スタンプラリー</h1>
    
    <div class="info-text" id="infoText">
        QRコードを読み取るとスタンプGET！<br>
        ゴール特典の景品は先着〇〇名様となります。無くなり次第終了となりますのでご了承ください。
    </div>

    <!-- スキャン起動ボタン -->
    <button class="scan-btn" onclick="simulateScan()">
        📷 <span id="scanBtnText">QRコードをよみとる</span>
    </button>

    <!-- わくわくコース (W) -->
    <div class="course-section course-w">
        <div class="course-title">🟢 <span id="titleW">わくわくコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-W1" onclick="showHint('W1')">W1</div>
            <div class="stamp-slot" id="slot-W2" onclick="showHint('W2')">W2</div>
            <div class="stamp-slot" id="slot-W3" onclick="showHint('W3')">W3</div>
            <div class="stamp-slot" id="slot-W4" onclick="showHint('W4')">W4</div>
            <div class="stamp-slot goal" id="slot-W-goal">★</div>
        </div>
    </div>

    <!-- うきうきコース (U) -->
    <div class="course-section course-u">
        <div class="course-title">🔵 <span id="titleU">うきうきコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-U1" onclick="showHint('U1')">U1</div>
            <div class="stamp-slot" id="slot-U2" onclick="showHint('U2')">U2</div>
            <div class="stamp-slot" id="slot-U3" onclick="showHint('U3')">U3</div>
            <div class="stamp-slot" id="slot-U4" onclick="showHint('U4')">U4</div>
            <div class="stamp-slot goal" id="slot-U-goal">★</div>
        </div>
    </div>

    <!-- 状態メッセージ -->
    <div class="status-msg" id="statusMsg">
        QRコードをよみとってスタンプをあつめよう！
    </div>

    <button class="reset-btn" onclick="resetRally()" id="resetBtn">リセット</button>
</div>

<script>
    // --- 各スポットの施設ホームページURL ---
    const spotLinks = {
        "W1": "https://www.google.com",
        "W2": "https://www.yahoo.co.jp",
        "W3": "https://www.bing.com",
        "W4": "https://www.wikipedia.org",
        "U1": "https://www.google.com",
        "U2": "https://www.yahoo.co.jp",
        "U3": "https://www.bing.com",
        "U4": "https://www.wikipedia.org"
    };

    // --- 各スポットの「場所ヒント」データ ---
    const hintTexts = {
        ja: {
            "W1": "🔍【W1のヒント】入口のちかく、大きな看板（かんばん）のしたにあるよ！",
            "W2": "🔍【W2のヒント】エレベーターをおりて、右がわに進んだお店だよ！",
            "W3": "🔍【W3のヒント】みんなが大好きな、おもちゃコーナーの奥（おく）にあります！",
            "W4": "🔍【W4のヒント】休憩（きゅうけい）スペースの、自動販売機のよこだよ！",
            "U1": "🔍【U1のヒント】インフォメーションセンターのすぐ裏がわだよ！",
            "U2": "🔍【U2のヒント】絵本（えほん）がたくさんならんでいるお部屋の入り口だよ！",
            "U3": "🔍【U3のヒント】授乳室（じゅにゅうしつ）やトイレのちかくの通路（つうろ）だよ！",
            "U4": "🔍【U4のヒント】出口の手前、ガチャガチャがたくさん並んでいるところだよ！"
        },
        en: {
            "W1": "🔍 [W1 Hint] Located near the entrance, right under the big sign!",
            "W2": "🔍 [W2 Hint] Take the elevator down and walk to the shop on your right!",
            "W3": "🔍 [W3 Hint] Located in the back of everyone's favorite toy corner!",
            "W4": "🔍 [W4 Hint] Right next to the vending machines in the rest area!",
            "U1": "🔍 [U1 Hint] Located right behind the Information Center!",
            "U2": "🔍 [U2 Hint] At the entrance of the room filled with many picture books!",
            "U3": "🔍 [U3 Hint] In the aisle near the nursing room and restrooms!",
            "U4": "🔍 [U4 Hint] Right before the exit, where all the capsule toy machines are!"
        },
        zh: {
            "W1": "🔍【W1 提示】就在入口附近，大招牌的正下方！",
            "W2": "🔍【W2 提示】走下电梯后，向右手边的店铺走去！",
            "W3": "🔍【W3 提示】位于大家最喜欢的玩具专区最里面！",
            "W4": "🔍【W4 提示】在休息区的自动售货机旁边！",
            "U1": "🔍【U1 提示】就在问询处（Information Center）的正后方！",
            "U2": "🔍【U2 提示】在摆满许多绘本的房间入口处！",
            "U3": "🔍【U3 提示】在哺乳室和洗手间附近的通道上！",
            "U4": "🔍【U4 提示】就在出口前，摆放着很多扭蛋机的地方！"
        },
        ko: {
            "W1": "🔍【W1 힌트】입구 근처, 큰 간판 바로 아래에 있어요!",
            "W2": "🔍【W2 힌트】엘리베이터에서 내려 오른쪽으로 가시면 있는 매장입니다!",
            "W3": "🔍【W3 힌트】모두가 좋아하는 장난감 코너 안쪽에 있습니다!",
            "W4": "🔍【W4 힌트】휴게 공간에 있는 자동판매기 바로 옆이에요!",
            "U1": "🔍【U1 힌트】안내소(인포메이션 센터) 바로 뒷방향에 있습니다!",
            "U2": "🔍【U2 힌트】그림책이 많이 진열되어 있는 방 입구에 있어요!",
            "U3": "🔍【U3 힌트】수유실과 화장실 근처 통로에 있습니다!",
            "U4": "🔍【U4 힌트】출구 직전, 캡슐토이 기계가 많이 나열된 곳입니다!"
        }
    };

    // --- 翻訳データ（その他UI・案内文含む） ---
    const i18n = {
        ja: {
            title: "わくわく スタンプラリー",
            info: "QRコードを読み取るとスタンプGET！<br>ゴール特典の景品は先着〇〇名様となります。無くなり次第終了となりますのでご了承ください。",
            scan: "QRコードをよみとる",
            courseW: "わくわくコース",
            courseU: "うきうきコース",
            hint: "QRコードをよみとってスタンプをあつめよう！",
            getSuccess: "🎉【{spot}】ゲット！<br><span style='font-size:12px; font-weight:normal;'>スタンプをタップすると施設サイトへ移動します</span>",
            clearW: "<strong>わくわくコースクリア！景品をもらってね！</strong>",
            reset: "リセット",
            btnNormal: "👁️ みやすさ：通常（カラー）",
            btnHigh: "👁️ みやすさ：はっきり（白黒）"
        },
        en: {
            title: "Exciting Stamp Rally",
            info: "Scan the QR code to GET a stamp!<br>Goal prizes are available for the first OO visitors on a first-come, first-served basis. Please note that the event will end as soon as prizes run out.",
            scan: "Scan QR Code",
            courseW: "Wakuwaku Course",
            courseU: "Ukiuki Course",
            hint: "Scan QR codes to collect stamps!",
            getSuccess: "🎉【{spot}】Got! <br><span style='font-size:12px; font-weight:normal;'>Tap the stamp to visit the website</span>",
            clearW: "<strong>Wakuwaku Course Complete! Get your prize!</strong>",
            reset: "Reset",
            btnNormal: "👁️ View: Normal (Color)",
            btnHigh: "👁️ View: High Contrast"
        },
        zh: {
            title: "集章拉力赛",
            info: "扫描QR码即可获得印章！<br>终点奖品数量有限（先到先得前〇〇名）。奖品发完即止，敬请谅解。",
            scan: "扫描QR码",
            courseW: "Wakuwaku 路线",
            courseU: "Ukiuki 路线",
            hint: "扫描QR码来收集印章！",
            getSuccess: "🎉【{spot}】成功！<br><span style='font-size:12px; font-weight:normal;'>点击印章访问官方网站</span>",
            clearW: "<strong>Wakuwaku 路线完成！快来领取奖品吧！</strong>",
            reset: "重置",
            btnNormal: "👁️ 视角: 普通（彩色）",
            btnHigh: "👁️ 视角: 高对比度（黑白）"
        },
        ko: {
            title: "두근두근 스탬프 랠리",
            info: "QR 코드를 스캔하면 스탬프 GET!<br>골 달성 사은품은 선착순 OO명 한정입니다. 사은품이 소진되는 대로 종료되오니 양해 바랍니다.",
            scan: "QR 코드 스캔",
            courseW: "와쿠와쿠 코스",
            courseU: "우키우키 코스",
            hint: "QR 코드를 스캔하여 스탬프를 모으세요!",
            getSuccess: "🎉【{spot}】획득!<br><span style='font-size:12px; font-weight:normal;'>스탬프를 탭하면 시설 사이트로 이동합니다</span>",
            clearW: "<strong>와쿠와쿠 코스 클리어! 경품을 받으세요!</strong>",
            reset: "리셋",
            btnNormal: "👁️ 보기: 일반 (컬러)",
            btnHigh: "👁️ 보기: 고대비 (흑백)"
        }
    };

    let currentLang = 'ja';
    let isHighContrast = false;
    let lastActiveSpot = null;
    let currentShowingHintSpot = null;
    let isCleared = false;

    function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        document.getElementById('mainTitle').innerText = i18n[lang].title;
        document.getElementById('infoText').innerHTML = i18n[lang].info;
        document.getElementById('scanBtnText').innerText = i18n[lang].scan;
        document.getElementById('titleW').innerText = i18n[lang].courseW;
        document.getElementById('titleU').innerText = i18n[lang].courseU;
        document.getElementById('resetBtn').innerText = i18n[lang].reset;
        
        const statusEl = document.getElementById('statusMsg');
        if (isCleared) {
            statusEl.innerHTML = i18n[lang].clearW;
        } else if (currentShowingHintSpot) {
            statusEl.innerText = hintTexts[lang][currentShowingHintSpot];
        } else if (lastActiveSpot) {
            statusEl.innerHTML = i18n[lang].getSuccess.replace('{spot}', lastActiveSpot);
        } else {
            statusEl.innerText = i18n[lang].hint;
        }
        
        updateContrastButtonText();
    }

    function toggleContrast() {
        isHighContrast = !isHighContrast;
        if (isHighContrast) {
            document.body.classList.add('high-contrast');
        } else {
            document.body.classList.remove('high-contrast');
        }
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        if (isHighContrast) {
            btn.innerText = i18n[currentLang].btnNormal;
        } else {
            btn.innerText = i18n[currentLang].btnHigh;
        }
    }

    function showHint(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (slot && !slot.querySelector('img')) {
            lastActiveSpot = null;
            currentShowingHintSpot = spotCode;
            document.getElementById('statusMsg').innerText = hintTexts[currentLang][spotCode];
        }
    }

    // --- 【打合せデモ用ロジック】 ---
    let demoIndex = 0;
    const demoSpots = ["W1", "W2", "W3", "W4", "U1"];

    function simulateScan() {
        if (demoIndex < demoSpots.length) {
            const currentSpot = demoSpots[demoIndex];
            alert(`【デモ動作】QRコードから「${currentSpot}」を検出しました！スタンプを押します。`);
            stampPressed(currentSpot);
            demoIndex++;
        } else {
            alert("デモ用のスタンプは押し終わりました。一度リセットしてください。");
        }
    }

    function stampPressed(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (slot && !slot.querySelector('img')) {
            const destinationUrl = spotLinks[spotCode] || "#";
            
            slot.removeAttribute('onclick');
            
            slot.innerHTML = `
                <a href="${destinationUrl}" target="_blank" class="stamp-link">
                    <img src="HOW_logo_W1.png" class="stamp-image" alt="${spotCode}">
                </a>
            `;
            
            currentShowingHintSpot = null;
            lastActiveSpot = spotCode; 
            document.getElementById('statusMsg').innerHTML = i18n[currentLang].getSuccess.replace('{spot}', spotCode);
            checkGoal();
        }
    }

    function checkGoal() {
        const wCount = document.querySelectorAll('.course-w .stamp-image').length;
        if (wCount === 4) {
            isCleared = true;
            document.getElementById('slot-W-goal').innerText = "🎉";
            document.getElementById('statusMsg').innerHTML = i18n[currentLang].clearW;
        }
    }

    function resetRally() {
        localStorage.clear();
