<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく デジタルスタンプラリー</title>
    <style>
        /* --- 基本デザイン --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7ebd3;
            color: #333333;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px 15px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #ffcc00;
        }
        
        /* コントロールパネル */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .lang-btn.active {
            background-color: #ff5a5f;
            color: white;
        }
        .accessibility-box {
            width: 100%;
            max-width: 300px;
        }
        .contrast-toggle-btn {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff5a5f;
            margin: 10px 0;
            font-size: 26px;
        }
        .info-text {
            background-color: #fff5da;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            color: #665544;
            line-height: 1.5;
            text-align: left;
        }

        /* 📷 カメラエリア（追加） */
        .scan-btn {
            background-color: #ff5a5f;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 90, 95, 0.4);
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .camera-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            border: 3px solid #ff5a5f;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }
        #video-preview {
            width: 100%;
            height: auto;
            display: block;
        }
        .camera-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            border: 2px dashed #ff5a5f;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        /* コースエリア */
        .course-section {
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .course-w { background-color: #f0fdf4; border: 2px dashed #4ade80; }
        .course-u { background-color: #eff6ff; border: 2px dashed #60a5fa; }
        .course-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .course-w .course-title { color: #166534; }
        .course-u .course-title { color: #1e40af; }

        /* スタンプマス目 */
        .stamp-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 5px;
            overflow-x: auto;
        }
        .stamp-slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px dotted #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999999;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
        }
        .stamp-slot.goal {
            border: 2px dashed #fbbf24;
            background-color: #fffdf5;
            color: #fbbf24;
            font-size: 16px;
            cursor: default;
        }
        
        .stamp-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .stamp-default-mark {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #ffebd3;
            border: 2px solid #ff5a5f;
            color: #ff5a5f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* 状態メッセージエリア */
        .status-msg {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #e5e7eb;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }
        .facility-link-btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white !important;
            text-decoration: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 20px;
            margin-top: 5px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
            font-weight: bold;
        }
        .reset-btn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #d1d5db;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* --- 高コントラストモード --- */
        body.high-contrast { background-color: #000000 !important; color: #ffffff !important; }
        body.high-contrast .container { background-color: #000000 !important; color: #ffffff !important; border: 5px solid #ffffff !important; }
        body.high-contrast .contrast-toggle-btn { background-color: #ffffff !important; color: #000000 !important; border: 4px solid #ffffff !important; }
        body.high-contrast .lang-btn { background-color: #333333 !important; color: #ffffff !important; border: 2px solid #ffffff !important; }
        body.high-contrast .lang-btn.active { background-color: #ffffff !important; color: #000000 !important; border: 3px solid #ffffff !important; }
        body.high-contrast h1 { color: #ffffff !important; font-weight: 900 !important; }
        body.high-contrast .info-text { background-color: #000000 !important; color: #ffffff !important; border: 3px solid #ffffff !important; }
        body.high-contrast .scan-btn { background-color: #ffffff !important; color: #000000 !important; border: 4px solid #ffffff !important; }
        body.high-contrast .camera-container { border: 4px solid #ffffff !important; }
        body.high-contrast .camera-overlay { border: 3px dashed #ffffff !important; }
        body.high-contrast .course-section { background-color: #000000 !important; border: 4px solid #ffffff !important; }
        body.high-contrast .course-title { color: #ffffff !important; font-size: 22px !important; }
        body.high-contrast .stamp-slot { background-color: #000000 !important; color: #ffffff !important; border: 3px solid #ffffff !important; width: 65px !important; height: 65px !important; font-size: 16px !important; }
        body.high-contrast .stamp-slot.goal { border: 4px double #ffffff !important; color: #ffffff !important; }
        body.high-contrast .stamp-image { filter: contrast(150%) brightness(110%); border: 2px solid #ffffff; }
        body.high-contrast .stamp-default-mark { background-color: #ffffff !important; color: #000000 !important; border: 3px solid #000000 !important; }
        body.high-contrast .status-msg { background-color: #000000 !important; color: #ffffff !important; border: 3px solid #ffffff !important; font-size: 18px !important; }
        body.high-contrast .facility-link-btn { background-color: #ffffff !important; color: #000000 !important; border: 2px solid #ffffff !important; }
        body.high-contrast .reset-btn { background-color: #000000 !important; color: #ffffff !important; border: 2px solid #ffffff !important; font-size: 14px !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <div class="lang-buttons">
            <button class="lang-btn active" id="btn-ja" onclick="switchLang('ja')">日本語</button>
            <button class="lang-btn" id="btn-en" onclick="switchLang('en')">English</button>
            <button class="lang-btn" id="btn-zh" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" id="btn-ko" onclick="switchLang('ko')">한국어</button>
        </div>
        <div class="accessibility-box">
            <button class="contrast-toggle-btn" onclick="toggleContrast()" id="contrastBtn">
                👁️ みやすさ：通常（カラー）
            </button>
        </div>
    </div>

    <h1 id="mainTitle">わくわく スタンプラリー</h1>
    
    <div class="info-text" id="infoText">
        各スポットにあるQRコードを読み取るとスタンプが押されるよ！<br>
        ゴール特典の景品は先着順となります。無くなり次第終了となりますのでご了承ください。
    </div>

    <button class="scan-btn" onclick="toggleCamera()" id="scanBtn">
        📷 <span id="scanBtnText">QRコードを読み取る</span>
    </button>
    <div class="camera-container" id="cameraArea">
        <video id="video-preview" autoplay playsinline></video>
        <div class="camera-overlay"></div>
    </div>

    <div class="course-section course-w">
        <div class="course-title">🟢 <span id="titleW">わくわくコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-W1" onclick="handleSlotClick('W1')">W1</div>
            <div class="stamp-slot" id="slot-W2" onclick="handleSlotClick('W2')">W2</div>
            <div class="stamp-slot" id="slot-W3" onclick="handleSlotClick('W3')">W3</div>
            <div class="stamp-slot" id="slot-W4" onclick="handleSlotClick('W4')">W4</div>
            <div class="stamp-slot goal" id="slot-W-goal">★</div>
        </div>
    </div>

    <div class="course-section course-u">
        <div class="course-title">🔵 <span id="titleU">うきうきコース</span></div>
        <div class="stamp-grid">
            <div class="stamp-slot" id="slot-U1" onclick="handleSlotClick('U1')">U1</div>
            <div class="stamp-slot" id="slot-U2" onclick="handleSlotClick('U2')">U2</div>
            <div class="stamp-slot" id="slot-U3" onclick="handleSlotClick('U3')">U3</div>
            <div class="stamp-slot" id="slot-U4" onclick="handleSlotClick('U4')">U4</div>
            <div class="stamp-slot goal" id="slot-U-goal">★</div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">
        QRコードをよみとってスタンプをあつめよう！
    </div>

    <button class="reset-btn" onclick="resetRally()" id="resetBtn">最初からやり直す</button>
</div>

    // ==========================================
    // ⚙️ 本番用マスタデータ設定エリア
    // ==========================================

        images: {

                    "U4": { name: "施設U4（未定）", message: "ここに施設の紹介テキストが入ります。", url: "https://www.kodomo-how.com/", hint: "🔍【U4のヒント】施設U4の場所のヒントがここに入ります。" }
                },
                ui: {
                    title: "わくわく スタンプラリー",
                    info: "各スポットにあるQRコードを読み取るとスタンプが押されるよ！<br>ゴール特典の景品は先着順となります。無くなり次第終了となりますのでご了承ください。",
                    scanBtnStart: "QRコードを読み取る",
                    scanBtnStop: "カメラを閉じる",
                    courseW: "わくわくコース",
                    courseU: "うきうきコース",
                    defaultHint: "QRコードをよみとってスタンプをあつめよう！",
                    clearW: "<strong>わくわくコースクリア！景品をもらってね！ 🎉</strong>",
                    reset: "最初からやり直す",
                    btnNormal: "👁️ みやすさ：通常（カラー）",
                    btnHigh: "👁️ みやすさ：はっきり（白黒）",
                    goWeb: "ホームページをみる 🔗",

                }
            },

                spots: {
                    "W1": { name: "City of Kitakyushu Kodomo no Yakata", message: "An indoor play facility packed with fun for kids! ♪", url: "https://www.kodomo-how.com/", hint: "🔍 [W1 Hint] Take the red elevator to the 7th floor! Near the reception♪" },

                    "W4": { name: "Facility W4 (TBD)", message: "Description here.", url: "https://www.kodomo-how.com/", hint: "🔍 [W4 Hint] Location hint here." },
                    "U1": { name: "Facility U1 (TBD)", message: "Description here.", url: "https://www.kodomo-how.com/", hint: "🔍 [U1 Hint] Location hint here." },
                    "U2": { name: "Facility U2 (TBD)", message: "Description here.", url: "https://www.kodomo-how.com/", hint: "🔍 [U2 Hint] Location hint here." },
                    "U3": { name: "Facility U3 (TBD)", message: "Description here.", url: "https://www.kodomo-how.com/", hint: "🔍 [U3 Hint] Location hint here." },
                    "U4": { name: "Facility U4 (TBD)", message: "Description here.", url: "https://www.kodomo-how.com/", hint: "🔍 [U4 Hint] Location hint here." }

                ui: {
                    title: "Exciting Stamp Rally",
                    info: "Scan the QR code at each spot to get a stamp!<br>Goal prizes are limited and available on a first-come, first-served basis.",

                    scanBtnStop: "Close Camera",
                    courseW: "Wakuwaku Course",
                    courseU: "Ukiuki Course",
                    defaultHint: "Scan QR codes to collect stamps!",
                    clearW: "<strong>Wakuwaku Course Complete! Get your prize! 🎉</strong>",

                    btnNormal: "👁️ View: Normal (Color)",
                    btnHigh: "👁️ View: High Contrast",

                }
            },
            zh: {
                spots: {
                    "W1": { name: "北九州市立儿童之馆", message: "充满孩子们快乐的室内游乐设施♪", url: "https://www.kodomo-how.com/", hint: "🔍【W1 提示】搭乘红色电梯到7楼！就在接待处附近♪" },
                    "W2": { name: "设施 W2（暂定）", message: "介绍文本。", url: "https://www.kodomo-how.com/", hint: "🔍【W2 提示】地点提示。" }
                },
                ui: {
                    title: "集章拉力赛",
                    info: "扫描各景点的QR码即可获得印章！",

                    btnNormal: "👁️ 视角: 普通（彩色）",

                    "W2": { name: "시설 W2 (미정)", message: "소개 텍스트.", url: "https://www.kodomo-how.com/", hint: "🔍【W2 힌트】위치 힌트." }
                },
                ui: {
                    title: "두근두근 스탬프 랠리",
                    info: "각 스폿에 있는 QR 코드를 스캔하면 스탬프가 찍힙니다!",
                    scanBtnStart: "QR 코드 스캔",
                    scanBtnStop: "카메라 닫기",
                    courseW: "와쿠와쿠 코스",
                    courseU: "우키우키 코스",
                    defaultHint: "QR 코드를 스캔하여 스탬프를 모으세요!",
                    clearW: "<strong>와쿠와쿠 코스 클리어! 🎉</strong>",
                    reset: "다시 시작하기",
                    btnNormal: "👁️ 보기: 일반 (컬러)",
                    btnHigh: "👁️ 보기: 고대비 (흑백)",
                    goWeb: "홈페이지 보기 🔗",
                    stampDefaultText: "완"
                }
            }
        }
    };

    // --- 内部ロジック ---
    let currentLang = 'ja';
    let isHighContrast = false;
    let lastActiveSpot = null;          
    let collectedSpots = new Set();  
    let videoStream = null;

    function loadUserData() {
        const saved = localStorage.getItem('vaku_rally_data');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                collectedSpots = new Set(parsed.spots || []);
                lastActiveSpot = parsed.lastActive || null;
            } catch(e) {}
        }
    }

    function saveUserData() {
        const data = { spots: Array.from(collectedSpots), lastActive: lastActiveSpot };
        localStorage.setItem('vaku_rally_data', JSON.stringify(data));
    }

    function switchLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${lang}`);
        if(activeBtn) activeBtn.classList.add('active');

        const textUI = spotMaster.languages[currentLang].ui;
        document.getElementById('mainTitle').innerText = textUI.title;
        document.getElementById('infoText').innerHTML = textUI.info;
        document.getElementById('titleW').innerText = textUI.courseW;
        document.getElementById('titleU').innerText = textUI.courseU;
        document.getElementById('resetBtn').innerText = textUI.reset;
        
        updateScanButtonText();
        updateStampDisplayAll();
        updateMessageArea();
        updateContrastButtonText();
    }

    function updateScanButtonText() {
        const textUI = spotMaster.languages[currentLang].ui;
        const scanBtnText = document.getElementById('scanBtnText');
        if (videoStream) {
            scanBtnText.innerText = textUI.scanBtnStop;
        } else {
            scanBtnText.innerText = textUI.scanBtnStart;
        }
    }

    function updateMessageArea() {
        const statusEl = document.getElementById('statusMsg');
        const textUI = spotMaster.languages[currentLang].ui;
        const spotsData = spotMaster.languages[currentLang].spots;
        
        const wSpots = ["W1", "W2", "W3", "W4"];
        const isWComplete = wSpots.every(spot => collectedSpots.has(spot));

        if (isWComplete) {
            statusEl.innerHTML = textUI.clearW;
            document.getElementById('slot-W-goal').innerText = "🎉";
            return;
        } else {
            document.getElementById('slot-W-goal').innerText = "★";
        }

        if (lastActiveSpot && spotsData[lastActiveSpot]) {
            const detail = spotsData[lastActiveSpot];
            if (collectedSpots.has(lastActiveSpot)) {
                statusEl.innerHTML = `
                    <div><strong>🎉【${detail.name}】GET!</strong></div>
                    <div style="font-size: 13px; font-weight: normal; color: #666; margin: 2px 0;">${detail.message}</div>
                    <a href="${detail.url}" target="_blank" class="facility-link-btn">${textUI.goWeb}</a>
                `;
            } else {
                statusEl.innerText = detail.hint;
            }
        } else {
            statusEl.innerText = textUI.defaultHint;
        }
    }

    function handleSlotClick(spotCode) {
        lastActiveSpot = spotCode;
        updateMessageArea();
        saveUserData();
    }

    function processStampInbound(spotCode) {
        if (!spotMaster.images.hasOwnProperty(spotCode)) return;

        if (!collectedSpots.has(spotCode)) {
            collectedSpots.add(spotCode);
            lastActiveSpot = spotCode;
            saveUserData();
            updateStampSlotVisual(spotCode);
            updateMessageArea();
        }
    }

    function updateStampSlotVisual(spotCode) {
        const slot = document.getElementById(`slot-${spotCode}`);
        if (!slot) return;

        if (collectedSpots.has(spotCode)) {
            const imgPath = spotMaster.images[spotCode];
            if (imgPath) {
                slot.innerHTML = `<img src="${imgPath}" class="stamp-image" alt="${spotCode}">`;
            } else {
                const textUI = spotMaster.languages[currentLang].ui;
                slot.innerHTML = `<div class="stamp-default-mark">${textUI.stampDefaultText}</div>`;
            }
        } else {
            slot.innerHTML = spotCode;
        }
    }

    function updateStampDisplayAll() {
        Object.keys(spotMaster.images).forEach(spotCode => { updateStampSlotVisual(spotCode); });
    }

    // 🎥 カメラ起動・停止処理（復活＆拡張）
    async function toggleCamera() {
        const cameraArea = document.getElementById('cameraArea');
        const video = document.getElementById('video-preview');

        if (videoStream) {
            // カメラを止める処理
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
            cameraArea.style.display = "none";
            updateScanButtonText();
        } else {
            // カメラを起動する処理
            try {
                // 本番（背面カメラ優先指定：facingMode: "environment"）
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                videoStream = stream;
                video.srcObject = stream;
                cameraArea.style.display = "block";
                updateScanButtonText();

                // 【会議・検証用エミュレート】
                // 実際の現場テストや環境整備が完了するまでは、カメラを起動した2秒後に
                // 未取得のスタンプをランダムに擬似検知してスタンプが押される仕組みにしてあります。
                setTimeout(() => {
                    if (videoStream) {
                        const available = Object.keys(spotMaster.images).filter(s => !collectedSpots.has(s));
                        if (available.length > 0) {
                            const nextSpot = available[0];
                            alert(`【カメラテスト】QRコード「${nextSpot}」を検知しました！`);
                            processStampInbound(nextSpot);
                        }
                        toggleCamera(); // 読み取ったら自動で閉じる
                    }
                }, 2500);

            } catch (err) {
                alert("カメラの起動に失敗しました。ブラウザのカメラ権限を許可してください。");
                console.error(err);
            }
        }
    }

    function toggleContrast() {
        isHighContrast = !isHighContrast;
        document.body.classList.toggle('high-contrast', isHighContrast);
        updateContrastButtonText();
    }

    function updateContrastButtonText() {
        const btn = document.getElementById('contrastBtn');
        const textUI = spotMaster.languages[currentLang].ui;
        btn.innerText = isHighContrast ? textUI.btnNormal : textUI.btnHigh;
    }

    function resetRally() {
        if (confirm("集めたスタンプをすべて消去してリセットします。よろしいですか？")) {
            localStorage.removeItem('vaku_rally_data');
            collectedSpots.clear();
            lastActiveSpot = null;
            updateStampDisplayAll();
            switchLang(currentLang);
        }
    }

    function checkUrlParameter() {
        const urlParams = new URLSearchParams(window.location.search);
        const spotCode = urlParams.get('spot');
        if (spotCode) {
            setTimeout(() => {
                processStampInbound(spotCode.toUpperCase());
                window.history.replaceState({}, document.title, window.location.pathname);
            }, 300);
        }
    }

    // 初期化
    loadUserData();
    switchLang('ja');
    checkUrlParameter();
</script>

</body>
</html>
